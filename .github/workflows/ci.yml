name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, agent-relay]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run checks
        id: checks
        continue-on-error: true
        run: npm run check > check.log 2>&1
      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log
      - name: Fail when checks failed
        if: steps.checks.outcome == 'failure'
        run: |
          cat check.log
          exit 1
