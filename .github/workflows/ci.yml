name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply executor activity fixture correction
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/patch-executor-activity-fixtures.py
          if git diff --quiet -- test/executor.integration.test.ts test/trust.test.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/executor.integration.test.ts test/trust.test.ts
          git commit -m "Fix executor activity test fixtures"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > "${RUNNER_TEMP}/agent-relay-typecheck-output.log" 2>&1
          status=$?
          if (( status != 0 )); then
            cat "${RUNNER_TEMP}/agent-relay-typecheck-output.log"
          fi
          exit "${status}"

      - name: Upload typecheck failure output
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-typecheck-output
          path: ${{ runner.temp }}/agent-relay-typecheck-output.log
          if-no-files-found: error

      - name: Run tests and coverage
        id: tests
        shell: bash
        run: |
          set +e
          npm test > "${RUNNER_TEMP}/agent-relay-test-output.log" 2>&1
          status=$?
          if (( status != 0 )); then
            tail -n 80 "${RUNNER_TEMP}/agent-relay-test-output.log"
          fi
          exit "${status}"

      - name: Upload test failure output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-test-output
          path: ${{ runner.temp }}/agent-relay-test-output.log
          if-no-files-found: error

      - name: Validate production runtime build
        run: npm run check:runtime

      - name: Validate shell scripts
        run: npm run check:shell

      - name: Validate Node scripts
        run: npm run check:node-scripts

      - name: Validate toolchain
        run: npm run check:toolchain

      - name: Validate system scripts
        id: system
        shell: bash
        run: |
          set +e
          npm run check:system > "${RUNNER_TEMP}/agent-relay-system-output.log" 2>&1
          status=$?
          if (( status != 0 )); then
            tail -n 120 "${RUNNER_TEMP}/agent-relay-system-output.log"
          fi
          exit "${status}"

      - name: Upload system failure output
        if: failure() && steps.system.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-system-output
          path: ${{ runner.temp }}/agent-relay-system-output.log
          if-no-files-found: error
