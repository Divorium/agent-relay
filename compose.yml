services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUNNER_REPOSITORY_URL: ${RUNNER_REPOSITORY_URL}
      RUNNER_NAME: ${RUNNER_NAME:-agent-relay-runner}
      RUNNER_LABELS: ${RUNNER_LABELS:-agent-relay}
      AGENT_RELAY_URL: http://agent-relay:8080
      AGENT_RELAY_TOKEN: ${AGENT_RELAY_TOKEN}
    volumes:
      - workspace:/runner/_work
    networks:
      - relay
    depends_on:
      agent-relay:
        condition: service_healthy

  agent-relay:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AGENT_RELAY_TOKEN: ${AGENT_RELAY_TOKEN}
      SHARED_WORKSPACE_ROOT: /runner/_work
      AGENT_RELAY_STATE_DIR: /var/lib/agent-relay
      CODEX_TIMEOUT_MS: ${CODEX_TIMEOUT_MS:-21600000}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-10000000}
    volumes:
      - workspace:/runner/_work
      - relay-state:/var/lib/agent-relay
      - ${HOST_CODEX_DIR}:/home/agent/.codex
    networks:
      - relay
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  workspace:
  relay-state:

networks:
  relay:
