name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Establish native package integrity reference
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$(mktemp -d "$RUNNER_TEMP/codex-integrity-reference.XXXXXXXX")"
          trap 'rm -rf -- "$root"' EXIT
          mkdir "$root/home"
          env -i PATH="$PATH" HOME="$root/home" npm view @openai/codex@0.164.0 dist.integrity --json
          env -i PATH="$PATH" HOME="$root/home" npm install --global --prefix "$root/install" --cache "$root/npm-cache" --no-audit --no-fund @openai/codex@0.164.0
          printf 'CODEX_INTEGRITY_REFERENCE '
          node scripts/codex-cache-digest.mjs "$root/install"
          "$root/install/bin/codex" --version
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests and coverage
        run: npm test
      - name: Validate production runtime build
        run: npm run check:runtime
      - name: Validate shell scripts and job lifecycle
        run: npm run check:shell
      - name: Validate Node scripts
        run: npm run check:node-scripts
      - name: Validate toolchain
        run: npm run check:toolchain
