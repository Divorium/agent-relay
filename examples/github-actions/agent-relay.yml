name: Agent Relay

on:
  pull_request:
    types:
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to update
        required: true
        type: string
      plan_path:
        description: Active ExecPlan path in the pull request workspace
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: agent-relay-${{ github.repository }}-pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  codex:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, agent-relay]
    steps:
      - name: Resolve execution request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            pull_request)
              pr_number="${EVENT_PR_NUMBER}"
              ;;
            workflow_dispatch)
              pr_number="${INPUT_PR_NUMBER}"
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Pull request number must be a positive integer" >&2
            exit 1
          fi

          printf 'pr_number=%s\n' "${pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Resolve ready pull request
        id: pr
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
        run: node /runner/resolve-pr.mjs

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Verify resolved revision
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Verify credential-free checkout
        shell: bash
        run: |
          set -euo pipefail
          if git config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null; then
            echo "Checkout credentials must not remain in the repository config" >&2
            exit 1
          fi
          remote_url="$(git remote get-url origin)"
          case "${remote_url}" in
            *://*@*)
              echo "The repository remote must not contain embedded credentials" >&2
              exit 1
              ;;
          esac

      - name: Resolve active ExecPlan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          INPUT_PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Pull request base SHA is invalid" >&2
              exit 1
            fi

            mapfile -t candidates < <(
              git diff --name-only --diff-filter=AM "${BASE_SHA}...${HEAD_SHA}" -- \
                ':(glob)docs/exec-plans/active/*.md' | LC_ALL=C sort -u
            )

            if [[ "${#candidates[@]}" -ne 1 ]]; then
              echo "Expected exactly one added or modified active ExecPlan, found ${#candidates[@]}" >&2
              printf 'Candidate: %s\n' "${candidates[@]:-<none>}" >&2
              exit 1
            fi

            plan_path="${candidates[0]}"
          else
            plan_path="${INPUT_PLAN_PATH}"
          fi

          if [[ ! "${plan_path}" =~ ^docs/exec-plans/active/[A-Za-z0-9._-]+\.md$ ]]; then
            echo "ExecPlan must be a safe file directly under docs/exec-plans/active" >&2
            exit 1
          fi

          if [[ ! -f "${plan_path}" || -L "${plan_path}" ]]; then
            echo "ExecPlan must be a regular, non-symlink file: ${plan_path}" >&2
            exit 1
          fi

          printf 'plan_path=%s\n' "${plan_path}" >> "${GITHUB_OUTPUT}"

      - name: Run Codex through Agent Relay
        id: relay
        continue-on-error: true
        shell: bash
        env:
          AGENT_RELAY_TOKEN: ${{ secrets.AGENT_RELAY_TOKEN }}
          AGENT_RELAY_PLAN_PATH: ${{ steps.plan.outputs.plan_path }}
          AGENT_RELAY_OUTPUT_ARCHIVE_PATH: ${{ runner.temp }}/agent-relay-output.log
        run: |
          set -o pipefail
          node /runner/client.mjs 2>&1 | tee "${RUNNER_TEMP}/agent-relay-console.log"

      - name: Upload Agent Relay output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-output
          path: |
            ${{ runner.temp }}/agent-relay-output.log
            ${{ runner.temp }}/agent-relay-console.log
          if-no-files-found: warn

      - name: Fail when Agent Relay failed
        if: steps.relay.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Commit and push
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ steps.relay.outputs.commit_message }}
          TARGET_BRANCH: ${{ steps.pr.outputs.head_ref }}
          GITHUB_PUSH_TOKEN: ${{ github.token }}
        run: /runner/finalize.sh
