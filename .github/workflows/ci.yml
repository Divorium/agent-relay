name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests and coverage
        id: tests
        shell: bash
        run: |
          set +e
          npm test > "${RUNNER_TEMP}/agent-relay-test-output.log" 2>&1
          status=$?
          if (( status != 0 )); then
            tail -n 80 "${RUNNER_TEMP}/agent-relay-test-output.log"
          fi
          exit "${status}"

      - name: Upload test failure output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-test-output
          path: ${{ runner.temp }}/agent-relay-test-output.log
          if-no-files-found: error

      - name: Validate production runtime build
        run: npm run check:runtime

      - name: Validate shell scripts
        run: npm run check:shell

      - name: Validate Node scripts
        run: npm run check:node-scripts

      - name: Validate toolchain
        run: npm run check:toolchain

      - name: Validate system scripts
        id: system
        shell: bash
        run: |
          set +e
          npm run check:system > "${RUNNER_TEMP}/agent-relay-system-output.log" 2>&1
          status=$?
          if (( status != 0 )); then
            tail -n 120 "${RUNNER_TEMP}/agent-relay-system-output.log"
          fi
          exit "${status}"

      - name: Upload system failure output
        if: failure() && steps.system.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-system-output
          path: ${{ runner.temp }}/agent-relay-system-output.log
          if-no-files-found: error

      - name: Upload temporary repository snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-repository-snapshot
          path: |
            .
            !.git
            !node_modules
            !dist
          include-hidden-files: true
          if-no-files-found: error
