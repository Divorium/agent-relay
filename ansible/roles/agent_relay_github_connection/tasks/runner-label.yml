---
- name: Inspect Antigravity host capability
  become: true
  ansible.builtin.stat:
    path: "{{ agent_relay_antigravity_root }}/.ready"
    follow: false
  register: agent_relay_antigravity_ready

- name: Verify Antigravity Docker image when capability marker is present
  become: true
  ansible.builtin.command:
    argv: [/usr/bin/docker, image, inspect, antigravity-sandbox:latest]
  register: agent_relay_antigravity_image
  changed_when: false
  failed_when: false
  when:
    - agent_relay_antigravity_ready.stat.isreg | default(false)
    - not (agent_relay_antigravity_ready.stat.islnk | default(false))
    - agent_relay_antigravity_ready.stat.pw_name | default('') == 'root'

- name: Determine effective runner labels
  ansible.builtin.set_fact:
    agent_relay_effective_runner_labels: >-
      {{
        (agent_relay_runner_labels | reject('equalto', 'antigravity') | list)
        + (
          ['antigravity']
          if (
            agent_relay_antigravity_ready.stat.isreg | default(false)
            and not (agent_relay_antigravity_ready.stat.islnk | default(false))
            and agent_relay_antigravity_ready.stat.pw_name | default('') == 'root'
            and (agent_relay_antigravity_image.rc | default(1)) == 0
          )
          else []
        )
      }}

- name: Locate configured organization runner
  ansible.builtin.uri:
    url: >-
      {{
        'https://api.github.com/orgs/'
        ~ agent_relay_host_contract.organization
        ~ '/actions/runners?name='
        ~ (agent_relay_runner_name | urlencode)
        ~ '&per_page=100'
      }}
    method: GET
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ agent_relay_github_credential }}"
      X-GitHub-Api-Version: "{{ agent_relay_host_contract.github_api_version }}"
    return_content: true
    status_code: 200
  register: agent_relay_runner_inventory
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  until: >-
    agent_relay_runner_inventory.json.total_count | default(0) >= 1
  retries: 12
  delay: 5

- name: Require unambiguous organization runner
  ansible.builtin.assert:
    that:
      - agent_relay_runner_inventory.json.total_count == 1
      - agent_relay_runner_inventory.json.runners | length == 1
      - agent_relay_runner_inventory.json.runners[0].name == agent_relay_runner_name
    fail_msg: The configured per-host organization runner name must resolve to exactly one runner.

- name: Set managed runner labels
  ansible.builtin.uri:
    url: >-
      {{
        'https://api.github.com/orgs/'
        ~ agent_relay_host_contract.organization
        ~ '/actions/runners/'
        ~ (agent_relay_runner_inventory.json.runners[0].id | string)
        ~ '/labels'
      }}
    method: PUT
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ agent_relay_github_credential }}"
      X-GitHub-Api-Version: "{{ agent_relay_host_contract.github_api_version }}"
    body_format: json
    body:
      labels: "{{ agent_relay_effective_runner_labels }}"
    status_code: 200
  changed_when: true
  delegate_to: localhost
  become: false
  no_log: true
