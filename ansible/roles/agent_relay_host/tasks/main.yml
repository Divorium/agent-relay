---
- name: Validate administrator variables
  ansible.builtin.assert:
    that:
      - agent_relay_admin_user is match('^[a-z_][a-z0-9_-]*$')
      - agent_relay_admin_authorized_keys | length > 0
      - agent_relay_extra_apt_packages is iterable
    fail_msg: Configure a valid administrator name and at least one SSH public key.

- name: Install repository bootstrap packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - python3
      - sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure NodeSource repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ agent_relay_node_major }}.x
      Suites: nodistro
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/nodesource.asc

- name: Install Adoptium signing key
  ansible.builtin.get_url:
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public
    dest: /etc/apt/keyrings/adoptium.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Adoptium repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/adoptium.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://packages.adoptium.net/artifactory/deb
      Suites: trixie
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/adoptium.asc

- name: Install Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: trixie
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install host packages and configured extensions
  ansible.builtin.apt:
    name: "{{ (agent_relay_required_apt_packages + agent_relay_extra_apt_packages + ['nodejs', 'temurin-' ~ agent_relay_java_major ~ '-jdk']) | unique }}"
    state: present
    update_cache: true

- name: Inspect pre-existing package service policy
  ansible.builtin.stat:
    path: /usr/sbin/policy-rc.d
    follow: false
  register: agent_relay_policy_rc

- name: Refuse to overwrite an existing package service policy
  ansible.builtin.assert:
    that:
      - not agent_relay_policy_rc.stat.exists
    fail_msg: /usr/sbin/policy-rc.d already exists; remove or incorporate it deliberately before provisioning.

- name: Prevent package scripts from starting container services early
  ansible.builtin.copy:
    dest: /usr/sbin/policy-rc.d
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      case "$1" in
        docker|docker.service|docker.socket|containerd|containerd.service) exit 101 ;;
        *) exit 0 ;;
      esac

- name: Install Docker packages without premature service start
  block:
    - name: Install Docker Engine, containerd and Compose
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present
        update_cache: true
  always:
    - name: Remove temporary service-start policy
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent

- name: Create administrator group
  ansible.builtin.group:
    name: "{{ agent_relay_admin_user }}"
    state: present

- name: Create administrator account
  ansible.builtin.user:
    name: "{{ agent_relay_admin_user }}"
    group: "{{ agent_relay_admin_user }}"
    groups: sudo
    append: false
    shell: /bin/bash
    create_home: true
    password_lock: true
    state: present

- name: Create administrator SSH directory
  ansible.builtin.file:
    path: "/home/{{ agent_relay_admin_user }}/.ssh"
    state: directory
    owner: "{{ agent_relay_admin_user }}"
    group: "{{ agent_relay_admin_user }}"
    mode: "0700"

- name: Install administrator authorized keys
  ansible.builtin.copy:
    dest: "/home/{{ agent_relay_admin_user }}/.ssh/authorized_keys"
    owner: "{{ agent_relay_admin_user }}"
    group: "{{ agent_relay_admin_user }}"
    mode: "0600"
    content: "{{ agent_relay_admin_authorized_keys | join('\n') }}\n"

- name: Grant administrator passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/agent-relay-admin
    owner: root
    group: root
    mode: "0440"
    content: "{{ agent_relay_admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    validate: /usr/sbin/visudo -cf %s

- name: Create service groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ agent_relay_runner_user }}"
    - "{{ agent_relay_builder_user }}"
    - docker

- name: Create GitHub runner account
  ansible.builtin.user:
    name: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"
    groups: docker
    append: false
    home: "{{ agent_relay_runner_home }}"
    shell: /bin/bash
    system: true
    create_home: true
    password_lock: true
    state: present

- name: Create runtime builder account
  ansible.builtin.user:
    name: "{{ agent_relay_builder_user }}"
    group: "{{ agent_relay_builder_user }}"
    groups: ""
    append: false
    home: "{{ agent_relay_build_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true
    password_lock: true
    state: present

- name: Create root-owned directory roots
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /srv/github-runner, mode: "0755" }
    - { path: "{{ agent_relay_storage_root }}", mode: "0755" }
    - { path: "{{ agent_relay_storage_root }}/docker", mode: "0711" }
    - { path: "{{ agent_relay_docker_root }}", mode: "0711" }
    - { path: "{{ agent_relay_containerd_root }}", mode: "0711" }
    - { path: /var/lib/agent-relay, mode: "0755" }

- name: Create administrator-owned source root
  ansible.builtin.file:
    path: "{{ agent_relay_source_root }}"
    state: directory
    owner: "{{ agent_relay_admin_user }}"
    group: "{{ agent_relay_admin_user }}"
    mode: "0755"
    recurse: false

- name: Create runner-owned paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"
    mode: "0700"
    recurse: false
  loop:
    - "{{ agent_relay_runner_root }}"
    - "{{ agent_relay_work_root }}"
    - "{{ agent_relay_runner_home }}"

- name: Create builder home
  ansible.builtin.file:
    path: "{{ agent_relay_build_home }}"
    state: directory
    owner: "{{ agent_relay_builder_user }}"
    group: "{{ agent_relay_builder_user }}"
    mode: "0700"
    recurse: false

- name: Create installer lock
  ansible.builtin.file:
    path: /var/lib/agent-relay/install.lock
    state: touch
    owner: "{{ agent_relay_admin_user }}"
    group: "{{ agent_relay_admin_user }}"
    mode: "0600"
    access_time: preserve
    modification_time: preserve

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart container stack

- name: Configure containerd
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart container stack

- name: Flush container service handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start container services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - containerd.service
    - docker.socket
    - docker.service

- name: Install needrestart policy for GitHub runner units
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/actions_runner_services.conf
    owner: root
    group: root
    mode: "0644"
    content: "$nrconf{override_rc}{qr(^actions\\.runner\\..+\\.service$)} = 0;\n"

- name: Resolve installed Java home
  ansible.builtin.command:
    argv: ["/usr/bin/readlink", "-f", "/usr/bin/javac"]
  register: agent_relay_javac_path
  changed_when: false

- name: Create Java toolchain root
  ansible.builtin.file:
    path: /opt/java
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Link Java toolchain root
  ansible.builtin.file:
    src: "{{ agent_relay_javac_path.stdout | dirname | dirname }}"
    dest: /opt/java/openjdk
    state: link
    owner: root
    group: root
    force: true

- name: Inspect installed Go version
  ansible.builtin.command:
    argv: ["/usr/local/go/bin/go", "version"]
  register: agent_relay_go_current
  changed_when: false
  failed_when: false

- name: Remove a different Go installation
  ansible.builtin.file:
    path: /usr/local/go
    state: absent
  when: "'go' ~ agent_relay_go_version not in agent_relay_go_current.stdout"

- name: Download configured Go archive
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ agent_relay_go_version }}.linux-amd64.tar.gz"
    dest: "/var/tmp/go{{ agent_relay_go_version }}.linux-amd64.tar.gz"
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:{{ agent_relay_go_sha256 }}"
  when: "'go' ~ agent_relay_go_version not in agent_relay_go_current.stdout"

- name: Install configured Go archive
  ansible.builtin.unarchive:
    src: "/var/tmp/go{{ agent_relay_go_version }}.linux-amd64.tar.gz"
    dest: /usr/local
    remote_src: true
    owner: root
    group: root
  when: "'go' ~ agent_relay_go_version not in agent_relay_go_current.stdout"

- name: Create Rust toolchain roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/rust
    - /opt/rust/cargo
    - /opt/rust/rustup

- name: Download verified rustup-init
  ansible.builtin.get_url:
    url: https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
    dest: /usr/local/sbin/agent-relay-rustup-init
    owner: root
    group: root
    mode: "0755"
    checksum: sha256:https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256

- name: Initialize rustup
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/agent-relay-rustup-init
      - -y
      - --default-toolchain
      - "{{ agent_relay_rust_toolchain }}"
      - --profile
      - minimal
      - --no-modify-path
    creates: /opt/rust/cargo/bin/rustup
  environment:
    CARGO_HOME: /opt/rust/cargo
    RUSTUP_HOME: /opt/rust/rustup

- name: Inspect configured Rust toolchain
  ansible.builtin.command:
    argv: ["/opt/rust/cargo/bin/rustup", "show", "active-toolchain"]
  environment:
    CARGO_HOME: /opt/rust/cargo
    RUSTUP_HOME: /opt/rust/rustup
  register: agent_relay_rust_active
  changed_when: false
  failed_when: false

- name: Select configured Rust toolchain
  ansible.builtin.command:
    argv: ["/opt/rust/cargo/bin/rustup", "default", "{{ agent_relay_rust_toolchain }}"]
  environment:
    CARGO_HOME: /opt/rust/cargo
    RUSTUP_HOME: /opt/rust/rustup
  when: "not agent_relay_rust_active.stdout.startswith(agent_relay_rust_toolchain)"

- name: Publish Rust executables
  ansible.builtin.file:
    src: "/opt/rust/cargo/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    owner: root
    group: root
    force: true
  loop:
    - cargo
    - rustc
    - rustdoc
    - rustup

- name: Check configured global npm packages
  ansible.builtin.command:
    argv:
      - /usr/bin/npm
      - list
      - --global
      - --prefix
      - /usr/local
      - --depth=0
      - "typescript@{{ agent_relay_typescript_version }}"
      - "@openai/codex@{{ agent_relay_codex_version }}"
  register: agent_relay_npm_packages
  changed_when: false
  failed_when: false

- name: Install configured TypeScript and Codex CLI versions
  ansible.builtin.command:
    argv:
      - /usr/bin/npm
      - install
      - --global
      - --prefix
      - /usr/local
      - "typescript@{{ agent_relay_typescript_version }}"
      - "@openai/codex@{{ agent_relay_codex_version }}"
  when: agent_relay_npm_packages.rc != 0

- name: Initialize system Git LFS configuration
  ansible.builtin.command:
    argv: ["/usr/bin/git", "lfs", "install", "--system", "--skip-repo"]
  changed_when: false
