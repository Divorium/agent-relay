name: Agent Relay Bootstrap

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: agent-relay-bootstrap-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  codex:
    if: >-
      github.event.issue.pull_request != null &&
      github.actor == 'mateusz-gorny' &&
      github.event.comment.body == '/agent-relay bootstrap ready-pr-gate'
    runs-on: [self-hosted, agent-relay]
    steps:
      - name: Resolve pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repository="$(jq -r '.head.repo.full_name' <<<"${response}")"
          head_ref="$(jq -r '.head.ref' <<<"${response}")"
          test "${head_repository}" = "${REPOSITORY}"
          git check-ref-format --branch "${head_ref}"
          printf 'head_ref=%s\n' "${head_ref}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Exclude relay artifact
        shell: bash
        run: |
          mkdir -p .agent-relay
          printf '%s\n' '.agent-relay/' >> .git/info/exclude
          rm -f .agent-relay/result.json

      - name: Run Codex through Agent Relay
        id: relay
        shell: bash
        env:
          AGENT_RELAY_PLAN_PATH: docs/exec-plans/active/2026-07-13-ready-pr-gate.md
          AGENT_RELAY_MODE: implement
          AGENT_RELAY_REQUEST_ID: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node /runner/client.mjs >> "${GITHUB_OUTPUT}"

      - name: Commit and push
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ steps.relay.outputs.commit_message }}
          TARGET_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: /runner/finalize.sh
