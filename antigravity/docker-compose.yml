services:
  agy:
    build: .
    image: antigravity-sandbox:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: bridge
    cap_drop:
      - ALL
    pids_limit: 8192
    mem_limit: 16g
    shm_size: '4gb'
    stdin_open: true
    environment:
      UE_ROOT: /ue5
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-.}
        target: /workspace
      - type: bind
        source: ${ACCOUNT_STATE_DIR:?ACCOUNT_STATE_DIR is required}
        target: /tmp/antigravity-home
      - type: bind
        source: ${SKILLS_DIR:-./skills}
        target: /shared-skills
      - type: bind
        source: /home/divo/.ssh/antigravity.priv
        target: /home/sandbox/.ssh/antigravity.priv
        read_only: true
      - type: bind
        source: ${UE5_DIR:?UE5_DIR is required - set to host path of Unreal Engine 5}
        target: /ue5
        read_only: true