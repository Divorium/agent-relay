---
- name: Resolve installed Java home
  ansible.builtin.command:
    argv: ["/usr/bin/readlink", "-f", "/usr/bin/javac"]
  register: agent_relay_javac_path
  changed_when: false

- name: Create Java toolchain root
  ansible.builtin.file:
    path: /opt/java
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Link Java toolchain root
  ansible.builtin.file:
    src: "{{ agent_relay_javac_path.stdout | dirname | dirname }}"
    dest: /opt/java/openjdk
    state: link
    owner: root
    group: root
    force: true

- name: Inspect installed Go version
  ansible.builtin.command:
    argv: ["/usr/local/go/bin/go", "version"]
  register: agent_relay_go_current
  changed_when: false
  failed_when: false

- name: Download configured Go archive
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ agent_relay_go_version }}.linux-amd64.tar.gz"
    dest: "/var/tmp/go{{ agent_relay_go_version }}.linux-amd64.tar.gz"
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:{{ agent_relay_go_sha256 }}"
  when: (agent_relay_go_current.stdout | trim) != ('go version go' ~ agent_relay_go_version ~ ' linux/amd64')

- name: Remove stale Go staging directory
  ansible.builtin.file:
    path: "/usr/local/.agent-relay-go-{{ agent_relay_go_version }}"
    state: absent
  when: (agent_relay_go_current.stdout | trim) != ('go version go' ~ agent_relay_go_version ~ ' linux/amd64')

- name: Create Go staging directory
  ansible.builtin.file:
    path: "/usr/local/.agent-relay-go-{{ agent_relay_go_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: (agent_relay_go_current.stdout | trim) != ('go version go' ~ agent_relay_go_version ~ ' linux/amd64')

- name: Extract configured Go archive to staging
  ansible.builtin.unarchive:
    src: "/var/tmp/go{{ agent_relay_go_version }}.linux-amd64.tar.gz"
    dest: "/usr/local/.agent-relay-go-{{ agent_relay_go_version }}"
    remote_src: true
    owner: root
    group: root
  when: (agent_relay_go_current.stdout | trim) != ('go version go' ~ agent_relay_go_version ~ ' linux/amd64')

- name: Validate staged Go toolchain
  ansible.builtin.command:
    argv:
      - "/usr/local/.agent-relay-go-{{ agent_relay_go_version }}/go/bin/go"
      - version
  register: agent_relay_go_staged
  changed_when: false
  failed_when: (agent_relay_go_staged.stdout | trim) != ('go version go' ~ agent_relay_go_version ~ ' linux/amd64')
  when: (agent_relay_go_current.stdout | trim) != ('go version go' ~ agent_relay_go_version ~ ' linux/amd64')

- name: Remove a different Go installation
  ansible.builtin.file:
    path: /usr/local/go
    state: absent
  when: (agent_relay_go_current.stdout | trim) != ('go version go' ~ agent_relay_go_version ~ ' linux/amd64')

- name: Activate staged Go toolchain
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - "/usr/local/.agent-relay-go-{{ agent_relay_go_version }}/go"
      - /usr/local/go
    creates: /usr/local/go/bin/go
  when: (agent_relay_go_current.stdout | trim) != ('go version go' ~ agent_relay_go_version ~ ' linux/amd64')

- name: Remove empty Go staging directory
  ansible.builtin.file:
    path: "/usr/local/.agent-relay-go-{{ agent_relay_go_version }}"
    state: absent
  when: (agent_relay_go_current.stdout | trim) != ('go version go' ~ agent_relay_go_version ~ ' linux/amd64')

- name: Create Rust toolchain roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/rust
    - /opt/rust/cargo
    - /opt/rust/rustup
    - /usr/local/libexec/agent-relay

- name: Download verified rustup-init
  ansible.builtin.get_url:
    url: https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
    dest: /usr/local/libexec/agent-relay/rustup-init
    owner: root
    group: root
    mode: "0755"
    checksum: sha256:https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256

- name: Initialize rustup
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/agent-relay/rustup-init
      - -y
      - --default-toolchain
      - "{{ agent_relay_rust_toolchain }}"
      - --profile
      - minimal
      - --no-modify-path
    creates: /opt/rust/cargo/bin/rustup
  environment:
    CARGO_HOME: /opt/rust/cargo
    RUSTUP_HOME: /opt/rust/rustup

- name: Inspect configured Rust toolchain
  ansible.builtin.command:
    argv: ["/opt/rust/cargo/bin/rustup", "show", "active-toolchain"]
  environment:
    CARGO_HOME: /opt/rust/cargo
    RUSTUP_HOME: /opt/rust/rustup
  register: agent_relay_rust_active
  changed_when: false
  failed_when: false

- name: Select configured Rust toolchain
  ansible.builtin.command:
    argv: ["/opt/rust/cargo/bin/rustup", "default", "{{ agent_relay_rust_toolchain }}"]
  environment:
    CARGO_HOME: /opt/rust/cargo
    RUSTUP_HOME: /opt/rust/rustup
  when: "not agent_relay_rust_active.stdout.startswith(agent_relay_rust_toolchain)"

- name: Publish Rust executables
  ansible.builtin.file:
    src: "/opt/rust/cargo/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    owner: root
    group: root
    force: true
  loop:
    - cargo
    - rustc
    - rustdoc
    - rustup

- name: Check configured global npm packages
  ansible.builtin.command:
    argv:
      - /usr/bin/npm
      - list
      - --global
      - --prefix
      - /usr/local
      - --depth=0
      - "typescript@{{ agent_relay_typescript_version }}"
      - "@openai/codex@{{ agent_relay_codex_version }}"
  register: agent_relay_npm_packages
  changed_when: false
  failed_when: false

- name: Install configured TypeScript and Codex CLI versions
  ansible.builtin.command:
    argv:
      - /usr/bin/npm
      - install
      - --global
      - --prefix
      - /usr/local
      - "typescript@{{ agent_relay_typescript_version }}"
      - "@openai/codex@{{ agent_relay_codex_version }}"
  when: agent_relay_npm_packages.rc != 0

- name: Initialize system Git LFS configuration
  ansible.builtin.command:
    argv: ["/usr/bin/git", "lfs", "install", "--system", "--skip-repo"]
  changed_when: false
