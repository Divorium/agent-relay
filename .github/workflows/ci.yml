name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests and coverage
        id: tests
        shell: bash
        run: |
          set +e
          npm test > "${RUNNER_TEMP}/agent-relay-test-output.log" 2>&1
          status=$?
          if (( status != 0 )); then
            tail -n 80 "${RUNNER_TEMP}/agent-relay-test-output.log"
          fi
          exit "${status}"

      - name: Upload test failure output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-test-output
          path: ${{ runner.temp }}/agent-relay-test-output.log
          if-no-files-found: error

      - name: Validate production runtime build
        run: npm run check:runtime

      - name: Validate shell scripts
        run: npm run check:shell

      - name: Validate Node scripts
        run: npm run check:node-scripts

      - name: Validate toolchain
        run: npm run check:toolchain

      - name: Validate system scripts
        run: npm run check:system

  hosted-pr26:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 26 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Match the production Node path
        shell: bash
        run: sudo ln -sf "$(command -v node)" /usr/bin/node

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:runtime
      - run: npm run check:shell
      - run: npm run check:node-scripts

      - name: Validate system scripts
        id: system
        shell: bash
        run: |
          set +e
          : > "${RUNNER_TEMP}/agent-relay-system-output.log"
          status=0
          for script in \
            test-system/install-script.integration.sh \
            test-system/update-script.integration.sh \
            test-system/docker-host.repository-safe.sh
          do
            printf '\n===== %s =====\n' "${script}" >> "${RUNNER_TEMP}/agent-relay-system-output.log"
            bash -x "${script}" >> "${RUNNER_TEMP}/agent-relay-system-output.log" 2>&1
            status=$?
            if (( status != 0 )); then
              break
            fi
          done
          if (( status != 0 )); then
            tail -n 180 "${RUNNER_TEMP}/agent-relay-system-output.log"
          fi
          exit "${status}"

      - name: Upload system-test failure output
        if: failure() && steps.system.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-system-output
          path: ${{ runner.temp }}/agent-relay-system-output.log
          if-no-files-found: error
