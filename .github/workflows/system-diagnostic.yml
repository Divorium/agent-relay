name: System diagnostic

on:
  push:
    branches:
      - agent/fix-docker-conffile-install

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: [self-hosted]
    steps:
      - name: Diagnose deployed system tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          cd /srv/github-runner/storage/agent-relay
          diagnostic="$(mktemp)"
          status=0
          for script in \
            test-system/install-script.integration.sh \
            test-system/update-script.integration.sh \
            test-system/docker-host.repository-safe.sh; do
            printf '=== %s ===\n' "${script}" >> "${diagnostic}"
            if bash "${script}" >> "${diagnostic}" 2>&1; then
              printf 'STATUS: PASS\n' >> "${diagnostic}"
            else
              script_status=$?
              printf 'STATUS: FAIL (%s)\n' "${script_status}" >> "${diagnostic}"
              status=1
            fi
          done
          body="$(printf 'Temporary system diagnostic on deployed main:\n\n```text\n'; tail -n 120 "${diagnostic}"; printf '\n```')"
          payload="$(/usr/bin/jq -n --arg body "${body}" '{body:$body}')"
          /usr/bin/curl -fsS \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/41/comments" \
            -d "${payload}"
          exit "${status}"
