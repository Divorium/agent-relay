name: PR 26 System Matrix

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  system:
    if: ${{ github.event.pull_request.number == 26 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - test-system/install-script.integration.sh
          - test-system/update-script.integration.sh
          - test-system/docker-host.repository-safe.sh
    name: ${{ matrix.script }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - shell: bash
        run: bash -x "${{ matrix.script }}"
