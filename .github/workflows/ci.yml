name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 26 && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure hosted Node
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 26 }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests and coverage
        id: tests
        shell: bash
        run: |
          set +e
          npm test > "${RUNNER_TEMP}/agent-relay-test-output.log" 2>&1
          status=$?
          if (( status != 0 )); then
            tail -n 80 "${RUNNER_TEMP}/agent-relay-test-output.log"
          fi
          exit "${status}"

      - name: Upload test failure output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: agent-relay-test-output
          path: ${{ runner.temp }}/agent-relay-test-output.log
          if-no-files-found: error

      - name: Validate production runtime build
        run: npm run check:runtime

      - name: Validate shell scripts
        run: npm run check:shell

      - name: Validate Node scripts
        run: npm run check:node-scripts

      - name: Validate toolchain
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 26 }}
        run: npm run check:toolchain

      - name: Validate system scripts
        run: npm run check:system
