name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    name: Secrets in the working tree
    # Follow the existing self-hosted PR-origin trust boundary.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository revision without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download and verify gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" gitleaks
          rm -f -- "$archive"
      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail
          ./gitleaks dir . --redact --no-banner --exit-code 1
      - name: Clean up downloaded scanner
        if: always()
        shell: bash
        run: rm -f -- gitleaks gitleaks_*.tar.gz
