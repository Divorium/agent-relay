---
- name: Inspect active runtime
  ansible.builtin.stat:
    path: "{{ agent_relay_source_root }}/dist"
    follow: false
  register: agent_relay_active_runtime_before_recovery

- name: Inspect preserved runtime
  ansible.builtin.stat:
    path: "{{ agent_relay_runtime_previous_root }}"
    follow: false
  register: agent_relay_previous_runtime_before_recovery

- name: Require regular runtime directories
  ansible.builtin.assert:
    that:
      - >-
        not agent_relay_active_runtime_before_recovery.stat.exists
        or (
          agent_relay_active_runtime_before_recovery.stat.isdir | default(false)
          and not (agent_relay_active_runtime_before_recovery.stat.islnk | default(false))
        )
      - >-
        not agent_relay_previous_runtime_before_recovery.stat.exists
        or (
          agent_relay_previous_runtime_before_recovery.stat.isdir | default(false)
          and not (agent_relay_previous_runtime_before_recovery.stat.islnk | default(false))
        )
    fail_msg: Runtime paths must be regular directories.

- name: Restore runtime left by an interrupted activation
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - --
      - "{{ agent_relay_runtime_previous_root }}"
      - "{{ agent_relay_source_root }}/dist"
  changed_when: true
  when:
    - not agent_relay_active_runtime_before_recovery.stat.exists
    - agent_relay_previous_runtime_before_recovery.stat.isdir | default(false)

- name: Remove obsolete preserved runtime
  ansible.builtin.file:
    path: "{{ agent_relay_runtime_previous_root }}"
    state: absent
  when: agent_relay_active_runtime_before_recovery.stat.exists

- name: Remove stale runtime stage
  ansible.builtin.file:
    path: "{{ agent_relay_runtime_stage_root }}"
    state: absent

- name: Build and activate runtime
  block:
    - name: Create private runtime stage
      ansible.builtin.file:
        path: "{{ agent_relay_runtime_stage_root }}"
        state: directory
        owner: "{{ agent_relay_builder_user }}"
        group: "{{ agent_relay_builder_user }}"
        mode: "0700"

    - name: Compile staged Agent Relay runtime
      become: true
      become_user: "{{ agent_relay_builder_user }}"
      ansible.builtin.command:
        argv:
          - /usr/bin/env
          - -i
          - "HOME={{ agent_relay_build_home }}"
          - "USER={{ agent_relay_builder_user }}"
          - "LOGNAME={{ agent_relay_builder_user }}"
          - SHELL=/usr/sbin/nologin
          - LANG=C.UTF-8
          - LC_ALL=C.UTF-8
          - "TMPDIR={{ agent_relay_build_home }}/tmp"
          - "TMP={{ agent_relay_build_home }}/tmp"
          - "TEMP={{ agent_relay_build_home }}/tmp"
          - "PATH={{ agent_relay_toolchain_path }}"
          - /usr/local/bin/tsc
          - -p
          - "{{ agent_relay_source_root }}/tsconfig.runtime.json"
          - --outDir
          - "{{ agent_relay_runtime_stage_root }}"
      changed_when: true

    - name: Require checked out source revision
      ansible.builtin.assert:
        that:
          - agent_relay_checkout_result.after is defined
          - agent_relay_checkout_result.after is match('^[0-9a-f]{40}$')
        fail_msg: The reconciled checkout did not report a commit revision.

    - name: Record runtime source revision
      become: true
      become_user: "{{ agent_relay_builder_user }}"
      ansible.builtin.copy:
        content: "{{ agent_relay_checkout_result.after }}\n"
        dest: "{{ agent_relay_runtime_stage_root }}/{{ agent_relay_runtime_revision_marker }}"
        owner: "{{ agent_relay_builder_user }}"
        group: "{{ agent_relay_builder_user }}"
        mode: "0600"

    - name: Import staged runtime entrypoint
      become: true
      become_user: "{{ agent_relay_builder_user }}"
      ansible.builtin.command:
        argv:
          - /usr/bin/env
          - -i
          - "HOME={{ agent_relay_build_home }}"
          - "USER={{ agent_relay_builder_user }}"
          - "LOGNAME={{ agent_relay_builder_user }}"
          - SHELL=/usr/sbin/nologin
          - LANG=C.UTF-8
          - LC_ALL=C.UTF-8
          - "TMPDIR={{ agent_relay_build_home }}/tmp"
          - "TMP={{ agent_relay_build_home }}/tmp"
          - "TEMP={{ agent_relay_build_home }}/tmp"
          - "PATH={{ agent_relay_toolchain_path }}"
          - "STAGED_ENTRYPOINT=file://{{ agent_relay_runtime_stage_root }}/src/run-codex.js"
          - /usr/bin/node
          - --input-type=module
          - -e
          - await import(process.env.STAGED_ENTRYPOINT)
      changed_when: false

    - name: Finalize staged runtime
      ansible.builtin.file:
        path: "{{ agent_relay_runtime_stage_root }}"
        state: directory
        owner: root
        group: root
        mode: u=rwX,go=rX
        recurse: true

    - name: Inspect active runtime before activation
      ansible.builtin.stat:
        path: "{{ agent_relay_source_root }}/dist"
        follow: false
      register: agent_relay_active_runtime_state

    - name: Activate staged runtime
      block:
        - name: Preserve active runtime
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --
              - "{{ agent_relay_source_root }}/dist"
              - "{{ agent_relay_runtime_previous_root }}"
          changed_when: true
          when: agent_relay_active_runtime_state.stat.exists

        - name: Promote staged runtime
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --
              - "{{ agent_relay_runtime_stage_root }}"
              - "{{ agent_relay_source_root }}/dist"
          changed_when: true

      rescue:
        - name: Inspect runtime after failed activation
          ansible.builtin.stat:
            path: "{{ agent_relay_source_root }}/dist"
            follow: false
          register: agent_relay_failed_activation_runtime

        - name: Inspect preserved runtime after failed activation
          ansible.builtin.stat:
            path: "{{ agent_relay_runtime_previous_root }}"
            follow: false
          register: agent_relay_failed_activation_previous

        - name: Restore preserved runtime after failed activation
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --
              - "{{ agent_relay_runtime_previous_root }}"
              - "{{ agent_relay_source_root }}/dist"
          changed_when: true
          when:
            - not agent_relay_failed_activation_runtime.stat.exists
            - agent_relay_failed_activation_previous.stat.isdir | default(false)
            - not (agent_relay_failed_activation_previous.stat.islnk | default(false))

        - name: Report runtime activation failure
          ansible.builtin.fail:
            msg: Agent Relay runtime activation failed.

    - name: Remove preserved runtime after successful activation
      ansible.builtin.file:
        path: "{{ agent_relay_runtime_previous_root }}"
        state: absent

  always:
    - name: Remove runtime stage
      ansible.builtin.file:
        path: "{{ agent_relay_runtime_stage_root }}"
        state: absent
