---
- name: Create root-owned directory roots
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ agent_relay_host_contract.base_root }}", mode: "0755" }
    - { path: "{{ agent_relay_storage_root }}", mode: "0755" }
    - { path: "{{ agent_relay_storage_root }}/docker", mode: "0711" }
    - { path: "{{ agent_relay_docker_root }}", mode: "0711" }
    - { path: "{{ agent_relay_containerd_root }}", mode: "0711" }
    - { path: /var/lib/agent-relay, mode: "0755" }

- name: Create administrator-owned source root
  ansible.builtin.file:
    path: "{{ agent_relay_source_root }}"
    state: directory
    owner: "{{ agent_relay_admin_user }}"
    group: "{{ agent_relay_admin_user }}"
    mode: "0755"
    recurse: false

- name: Inspect existing source checkout
  ansible.builtin.stat:
    path: "{{ agent_relay_source_root }}/.git"
    follow: false
  register: agent_relay_source_checkout

- name: Detect writable existing source checkout entries
  ansible.builtin.command:
    argv:
      - find
      - -P
      - "{{ agent_relay_source_root }}"
      - -xdev
      - "("
      - -type
      - f
      - -o
      - -type
      - d
      - ")"
      - -perm
      - /022
      - -print
      - -quit
  register: agent_relay_writable_source_entry
  changed_when: false
  when:
    - agent_relay_source_checkout.stat.exists | default(false)
    - agent_relay_source_checkout.stat.isdir | default(false)
    - not (agent_relay_source_checkout.stat.islnk | default(false))

- name: Remove group and other write permissions from existing source checkout
  ansible.builtin.command:
    argv:
      - find
      - -P
      - "{{ agent_relay_source_root }}"
      - -xdev
      - "("
      - -type
      - f
      - -o
      - -type
      - d
      - ")"
      - -perm
      - /022
      - -exec
      - chmod
      - go-w
      - --
      - "{}"
      - +
  when:
    - agent_relay_writable_source_entry.stdout | default('') | length > 0

- name: Create runner-owned paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"
    mode: "0700"
    recurse: false
  loop:
    - "{{ agent_relay_runner_root }}"
    - "{{ agent_relay_work_root }}"
    - "{{ agent_relay_runner_home }}"

- name: Create builder home
  ansible.builtin.file:
    path: "{{ agent_relay_build_home }}"
    state: directory
    owner: "{{ agent_relay_builder_user }}"
    group: "{{ agent_relay_builder_user }}"
    mode: "0700"
    recurse: false

- name: Create builder temporary directory
  ansible.builtin.file:
    path: "{{ agent_relay_build_home }}/tmp"
    state: directory
    owner: "{{ agent_relay_builder_user }}"
    group: "{{ agent_relay_builder_user }}"
    mode: "0700"
    recurse: false

- name: Create installer lock
  ansible.builtin.file:
    path: /var/lib/agent-relay/install.lock
    state: touch
    owner: "{{ agent_relay_admin_user }}"
    group: "{{ agent_relay_admin_user }}"
    mode: "0600"
    access_time: preserve
    modification_time: preserve
