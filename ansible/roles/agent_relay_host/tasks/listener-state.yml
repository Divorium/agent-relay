---
- name: Enable registered runner listener
  ansible.builtin.systemd_service:
    name: "{{ agent_relay_service_name }}"
    enabled: true
    state: started
  when: agent_relay_registration_marker.stat.isreg | default(false)

- name: Keep unregistered runner listener disabled
  ansible.builtin.systemd_service:
    name: "{{ agent_relay_service_name }}"
    enabled: false
    state: stopped
  when: not (agent_relay_registration_marker.stat.exists | default(false))
