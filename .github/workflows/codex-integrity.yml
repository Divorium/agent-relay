name: Codex distribution integrity

on:
  pull_request:
    paths:
      - "config/codex-integrity.json"
      - "scripts/codex-cache-digest.mjs"
      - ".github/workflows/codex-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fresh Codex distributions against trusted digest
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "const fs = require('fs'); const pins = JSON.parse(fs.readFileSync('config/codex-integrity.json', 'utf8')); const versions = Object.keys(pins); if (versions.length !== 1) process.exit(1); console.log(versions[0]);")"
          platform="$(node -p 'process.platform + "-" + process.arch')"
          root="$(mktemp -d "$RUNNER_TEMP/codex-integrity.XXXXXXXX")"
          trap 'rm -rf -- "$root"' EXIT
          for attempt in first second; do
            npm install --global --prefix "$root/$attempt" --cache "$root/cache-$attempt" \
              --no-audit --no-fund "@openai/codex@$version"
            rm -rf -- "$root/cache-$attempt"
            test "$("$root/$attempt/bin/codex" --version)" = "codex-cli $version"
            node scripts/codex-cache-digest.mjs "$root/$attempt" > "$root/$attempt.sha256"
            printf 'FRESH_CODEX_SHA256 version=%s platform=%s attempt=%s digest=%s\n' \
              "$version" "$platform" "$attempt" "$(cat "$root/$attempt.sha256")"
          done
          cmp "$root/first.sha256" "$root/second.sha256"
          node scripts/codex-cache-digest.mjs "$root/first" "$version" "$platform"
