---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart containerd
  ansible.builtin.systemd_service:
    name: containerd.service
    state: restarted
    enabled: true
  listen: Restart container stack

- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker.service
    state: restarted
    enabled: true
  listen: Restart container stack
