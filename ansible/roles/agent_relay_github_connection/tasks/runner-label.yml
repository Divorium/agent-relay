---
- name: Locate configured organization runner
  ansible.builtin.uri:
    url: >-
      {{
        'https://api.github.com/orgs/'
        ~ agent_relay_host_contract.organization
        ~ '/actions/runners?name='
        ~ (agent_relay_runner_name | urlencode)
        ~ '&per_page=100'
      }}
    method: GET
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ agent_relay_github_credential }}"
      X-GitHub-Api-Version: "{{ agent_relay_host_contract.github_api_version }}"
    return_content: true
    status_code: 200
  register: agent_relay_runner_inventory
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  until: >-
    agent_relay_runner_inventory.json.total_count | default(0) >= 1
  retries: 12
  delay: 5

- name: Require unambiguous organization runner
  ansible.builtin.assert:
    that:
      - agent_relay_runner_inventory.json.total_count == 1
      - agent_relay_runner_inventory.json.runners | length == 1
      - agent_relay_runner_inventory.json.runners[0].name == agent_relay_runner_name
    fail_msg: The configured per-host organization runner name must resolve to exactly one runner.

- name: Reconcile managed runner labels
  vars:
    agent_relay_runner_current_custom_labels: >-
      {{
        agent_relay_runner_inventory.json.runners[0].labels
        | selectattr('type', 'equalto', 'custom')
        | map(attribute='name')
        | map('lower')
        | sort
        | list
      }}
    agent_relay_runner_desired_custom_labels: >-
      {{ agent_relay_runner_labels | map('lower') | sort | list }}
  ansible.builtin.uri:
    url: >-
      {{
        'https://api.github.com/orgs/'
        ~ agent_relay_host_contract.organization
        ~ '/actions/runners/'
        ~ (agent_relay_runner_inventory.json.runners[0].id | string)
        ~ '/labels'
      }}
    method: PUT
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ agent_relay_github_credential }}"
      X-GitHub-Api-Version: "{{ agent_relay_host_contract.github_api_version }}"
    body_format: json
    body:
      labels: "{{ agent_relay_runner_labels }}"
    status_code: 200
  changed_when: true
  delegate_to: localhost
  become: false
  no_log: true
  when: agent_relay_runner_current_custom_labels != agent_relay_runner_desired_custom_labels
