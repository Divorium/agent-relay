---
- name: Install repository bootstrap packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3
      - python3-apt
      - sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install verified repository signing keys
  vars:
    agent_relay_repository_signing_keys:
      - name: NodeSource
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        destination: /etc/apt/keyrings/nodesource.asc
        fingerprint: 6F71F525282841EEDAF851B42F59B5F99B1BE0B4
      - name: Adoptium
        url: https://packages.adoptium.net/artifactory/api/gpg/key/public
        destination: /etc/apt/keyrings/adoptium.asc
        fingerprint: 3B04D753C9050D9A5D343F39843C48A565F8F04B
      - name: Docker
        url: https://download.docker.com/linux/debian/gpg
        destination: /etc/apt/keyrings/docker.asc
        fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
  block:
    - name: Remove stale repository signing key stage
      ansible.builtin.file:
        path: /var/tmp/agent-relay-apt-keys
        state: absent

    - name: Create private repository signing key stage
      ansible.builtin.file:
        path: /var/tmp/agent-relay-apt-keys
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Download repository signing keys to staging
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "/var/tmp/agent-relay-apt-keys/{{ item.name | lower }}.asc"
        owner: root
        group: root
        mode: "0600"
        force: true
      loop: "{{ agent_relay_repository_signing_keys }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Read staged repository signing key fingerprints
      ansible.builtin.command:
        argv:
          - /usr/bin/gpg
          - --show-keys
          - --with-colons
          - "/var/tmp/agent-relay-apt-keys/{{ item.name | lower }}.asc"
      loop: "{{ agent_relay_repository_signing_keys }}"
      loop_control:
        label: "{{ item.name }}"
      register: agent_relay_repository_signing_key_fingerprints
      changed_when: false

    - name: Require trusted repository signing keys
      ansible.builtin.assert:
        that:
          - >-
            ('fpr:::::::::' ~ item.item.fingerprint ~ ':') in item.stdout
        fail_msg: "The downloaded {{ item.item.name }} signing key has an unexpected fingerprint."
      loop: "{{ agent_relay_repository_signing_key_fingerprints.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Activate verified repository signing keys
      ansible.builtin.copy:
        src: "/var/tmp/agent-relay-apt-keys/{{ item.name | lower }}.asc"
        dest: "{{ item.destination }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ agent_relay_repository_signing_keys }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Remove repository signing key stage
      ansible.builtin.file:
        path: /var/tmp/agent-relay-apt-keys
        state: absent

- name: Configure NodeSource repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ agent_relay_node_major }}.x
      Suites: nodistro
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/nodesource.asc

- name: Configure Adoptium repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/adoptium.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://packages.adoptium.net/artifactory/deb
      Suites: trixie
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/adoptium.asc

- name: Configure Docker repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: trixie
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install host packages and configured extensions
  ansible.builtin.apt:
    name: "{{ (agent_relay_required_apt_packages + agent_relay_extra_apt_packages + ['temurin-' ~ agent_relay_java_major ~ '-jdk']) | unique }}"
    state: present
    update_cache: true

- name: Install configured Node.js major
  ansible.builtin.apt:
    name: "nodejs={{ agent_relay_node_major }}.*"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Remove packages conflicting with Docker Engine
  ansible.builtin.apt:
    name: "{{ agent_relay_docker_conflicting_packages }}"
    state: absent

- name: Install Docker packages without premature service start
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Create needrestart policy directory
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Protect GitHub runner units from automatic needrestart restarts
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/actions_runner_services.conf
    owner: root
    group: root
    mode: "0644"
    content: "$nrconf{override_rc}{qr(^actions\\.runner\\..+\\.service$)} = 0;\n"
