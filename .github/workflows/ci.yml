name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests and coverage
        run: npm test

      - name: Validate production runtime build
        run: npm run check:runtime

      - name: Validate shell scripts
        run: npm run check:shell

      - name: Validate Node scripts
        run: npm run check:node-scripts

      - name: Validate toolchain
        run: npm run check:toolchain

      - name: Validate system scripts
        run: npm run check:system
