---
- name: Download configured GitHub Runner archive
  ansible.builtin.get_url:
    url: >-
      {{
        'https://github.com/actions/runner/releases/download/v'
        ~ agent_relay_host_contract.runner_version
        ~ '/actions-runner-linux-x64-'
        ~ agent_relay_host_contract.runner_version
        ~ '.tar.gz'
      }}
    dest: "{{ agent_relay_runner_archive }}"
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:{{ agent_relay_host_contract.runner_sha256 }}"

- name: Inspect preserved runner payload
  ansible.builtin.stat:
    path: "{{ agent_relay_runner_backup_archive }}"
    follow: false
  register: agent_relay_preserved_runner_payload

- name: Require safe preserved runner payload
  ansible.builtin.assert:
    that:
      - >-
        not (agent_relay_preserved_runner_payload.stat.exists | default(false))
        or (
          agent_relay_preserved_runner_payload.stat.isreg | default(false)
          and not (agent_relay_preserved_runner_payload.stat.islnk | default(false))
        )
    fail_msg: Preserved GitHub Runner payload must be a regular archive.

- name: Recover runner payload left by an interrupted activation
  when: agent_relay_preserved_runner_payload.stat.isreg | default(false)
  block:
    - name: Validate preserved runner payload archive
      ansible.builtin.command:
        argv:
          - /usr/bin/tar
          - --list
          - --gzip
          - "--file={{ agent_relay_runner_backup_archive }}"
      changed_when: false

    - name: Remove interrupted runner payload while preserving registration and workspace
      ansible.builtin.command:
        argv:
          - /usr/bin/find
          - "{{ agent_relay_runner_root }}"
          - -mindepth
          - "1"
          - -maxdepth
          - "1"
          - "!"
          - -name
          - _work
          - "!"
          - -name
          - .runner
          - "!"
          - -name
          - .credentials
          - "!"
          - -name
          - .credentials_rsaparams
          - -print
          - -exec
          - /usr/bin/rm
          - -rf
          - --
          - "{}"
          - +
      register: agent_relay_interrupted_runner_payload
      changed_when: agent_relay_interrupted_runner_payload.stdout | length > 0

    - name: Restore preserved runner payload after interrupted activation
      ansible.builtin.unarchive:
        src: "{{ agent_relay_runner_backup_archive }}"
        dest: "{{ agent_relay_runner_root }}"
        remote_src: true
        owner: "{{ agent_relay_runner_user }}"
        group: "{{ agent_relay_runner_user }}"

    - name: Validate recovered runner payload
      ansible.builtin.command:
        argv:
          - "{{ agent_relay_runner_root }}/bin/Runner.Listener"
          - --version
      changed_when: false

    - name: Remove consumed preserved runner payload
      ansible.builtin.file:
        path: "{{ agent_relay_runner_backup_archive }}"
        state: absent

- name: Remove stale runner staging directory
  ansible.builtin.file:
    path: "{{ agent_relay_runner_stage_root }}"
    state: absent

- name: Create runner staging directory
  ansible.builtin.file:
    path: "{{ agent_relay_runner_stage_root }}"
    state: directory
    owner: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"
    mode: "0700"

- name: Extract configured GitHub Runner payload to staging
  ansible.builtin.unarchive:
    src: "{{ agent_relay_runner_archive }}"
    dest: "{{ agent_relay_runner_stage_root }}"
    remote_src: true
    owner: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"

- name: Validate staged GitHub Runner version
  ansible.builtin.command:
    argv:
      - "{{ agent_relay_runner_stage_root }}/bin/Runner.Listener"
      - --version
  register: agent_relay_staged_runner_version
  changed_when: false
  failed_when: >-
    agent_relay_staged_runner_version.rc != 0
    or (agent_relay_staged_runner_version.stdout | trim) != agent_relay_host_contract.runner_version

- name: Inspect active runner payload before activation
  ansible.builtin.stat:
    path: "{{ agent_relay_runner_root }}/bin/Runner.Listener"
    follow: false
  register: agent_relay_active_runner_before_activation

- name: Validate active runner payload before backup
  ansible.builtin.command:
    argv:
      - "{{ agent_relay_runner_root }}/bin/Runner.Listener"
      - --version
  register: agent_relay_active_runner_version_before_activation
  changed_when: false
  failed_when: false
  when:
    - agent_relay_active_runner_before_activation.stat.isreg | default(false)
    - not (agent_relay_active_runner_before_activation.stat.islnk | default(false))
    - agent_relay_active_runner_before_activation.stat.executable | default(false)

- name: Back up valid active runner payload
  ansible.builtin.command:
    argv:
      - /usr/bin/tar
      - --create
      - --gzip
      - "--file={{ agent_relay_runner_backup_archive }}"
      - "--directory={{ agent_relay_runner_root }}"
      - --exclude=./_work
      - --exclude=./.runner
      - --exclude=./.credentials
      - --exclude=./.credentials_rsaparams
      - .
  changed_when: true
  when: (agent_relay_active_runner_version_before_activation.rc | default(1)) == 0

- name: Inspect runner payload backup before activation
  ansible.builtin.stat:
    path: "{{ agent_relay_runner_backup_archive }}"
    follow: false
  register: agent_relay_runner_backup_before_activation

- name: Activate staged runner payload
  block:
    - name: Remove active runner payload while preserving registration and workspace
      ansible.builtin.command:
        argv:
          - /usr/bin/find
          - "{{ agent_relay_runner_root }}"
          - -mindepth
          - "1"
          - -maxdepth
          - "1"
          - "!"
          - -name
          - _work
          - "!"
          - -name
          - .runner
          - "!"
          - -name
          - .credentials
          - "!"
          - -name
          - .credentials_rsaparams
          - -print
          - -exec
          - /usr/bin/rm
          - -rf
          - --
          - "{}"
          - +
      register: agent_relay_removed_runner_payload
      changed_when: agent_relay_removed_runner_payload.stdout | length > 0

    - name: Install staged runner payload
      ansible.builtin.copy:
        src: "{{ agent_relay_runner_stage_root }}/"
        dest: "{{ agent_relay_runner_root }}/"
        remote_src: true
        owner: "{{ agent_relay_runner_user }}"
        group: "{{ agent_relay_runner_user }}"
        mode: preserve

    - name: Install runner service launcher
      ansible.builtin.copy:
        src: "{{ agent_relay_runner_root }}/bin/runsvc.sh"
        dest: "{{ agent_relay_runner_root }}/runsvc.sh"
        remote_src: true
        owner: "{{ agent_relay_runner_user }}"
        group: "{{ agent_relay_runner_user }}"
        mode: "0755"

    - name: Validate activated GitHub Runner version
      ansible.builtin.command:
        argv:
          - "{{ agent_relay_runner_root }}/bin/Runner.Listener"
          - --version
      register: agent_relay_activated_runner_version
      changed_when: false
      failed_when: >-
        agent_relay_activated_runner_version.rc != 0
        or (agent_relay_activated_runner_version.stdout | trim) != agent_relay_host_contract.runner_version

  rescue:
    - name: Remove failed runner payload while preserving registration and workspace
      ansible.builtin.command:
        argv:
          - /usr/bin/find
          - "{{ agent_relay_runner_root }}"
          - -mindepth
          - "1"
          - -maxdepth
          - "1"
          - "!"
          - -name
          - _work
          - "!"
          - -name
          - .runner
          - "!"
          - -name
          - .credentials
          - "!"
          - -name
          - .credentials_rsaparams
          - -exec
          - /usr/bin/rm
          - -rf
          - --
          - "{}"
          - +
      changed_when: true

    - name: Restore previous runner payload
      ansible.builtin.unarchive:
        src: "{{ agent_relay_runner_backup_archive }}"
        dest: "{{ agent_relay_runner_root }}"
        remote_src: true
        owner: "{{ agent_relay_runner_user }}"
        group: "{{ agent_relay_runner_user }}"
      when: agent_relay_runner_backup_before_activation.stat.isreg | default(false)

    - name: Validate restored runner payload
      ansible.builtin.command:
        argv:
          - "{{ agent_relay_runner_root }}/bin/Runner.Listener"
          - --version
      changed_when: false
      when: agent_relay_runner_backup_before_activation.stat.isreg | default(false)

    - name: Report runner payload activation failure
      ansible.builtin.fail:
        msg: GitHub Runner activation failed. The previous valid payload was restored when available.

- name: Reconcile runner root ownership and mode
  ansible.builtin.file:
    path: "{{ agent_relay_runner_root }}"
    state: directory
    owner: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"
    mode: "0700"
    recurse: false

- name: Remove runner staging directory after successful activation
  ansible.builtin.file:
    path: "{{ agent_relay_runner_stage_root }}"
    state: absent

- name: Remove runner payload backup after successful activation
  ansible.builtin.file:
    path: "{{ agent_relay_runner_backup_archive }}"
    state: absent
