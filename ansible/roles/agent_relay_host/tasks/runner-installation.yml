---
- name: Download configured GitHub Runner archive
  ansible.builtin.get_url:
    url: >-
      {{
        'https://github.com/actions/runner/releases/download/v'
        ~ agent_relay_host_contract.runner_version
        ~ '/actions-runner-linux-x64-'
        ~ agent_relay_host_contract.runner_version
        ~ '.tar.gz'
      }}
    dest: "{{ agent_relay_runner_archive }}"
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:{{ agent_relay_host_contract.runner_sha256 }}"

- name: Remove stale runner staging directory
  ansible.builtin.file:
    path: "{{ agent_relay_runner_stage_root }}"
    state: absent

- name: Create runner staging directory
  ansible.builtin.file:
    path: "{{ agent_relay_runner_stage_root }}"
    state: directory
    owner: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"
    mode: "0700"

- name: Extract configured GitHub Runner payload to staging
  ansible.builtin.unarchive:
    src: "{{ agent_relay_runner_archive }}"
    dest: "{{ agent_relay_runner_stage_root }}"
    remote_src: true
    owner: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"

- name: Validate staged GitHub Runner version
  ansible.builtin.command:
    argv:
      - "{{ agent_relay_runner_stage_root }}/bin/Runner.Listener"
      - --version
  register: agent_relay_staged_runner_version
  changed_when: false
  failed_when: >-
    agent_relay_staged_runner_version.rc != 0
    or (agent_relay_staged_runner_version.stdout | trim) != agent_relay_host_contract.runner_version

- name: Remove stale runner payload backup
  ansible.builtin.file:
    path: "{{ agent_relay_runner_backup_archive }}"
    state: absent

- name: Back up active runner payload
  ansible.builtin.command:
    argv:
      - /usr/bin/tar
      - --create
      - --gzip
      - "--file={{ agent_relay_runner_backup_archive }}"
      - "--directory={{ agent_relay_runner_root }}"
      - --exclude=./_work
      - --exclude=./.runner
      - --exclude=./.credentials
      - --exclude=./.credentials_rsaparams
      - .
  changed_when: true

- name: Activate staged runner payload
  block:
    - name: Remove active runner payload while preserving registration and workspace
      ansible.builtin.command:
        argv:
          - /usr/bin/find
          - "{{ agent_relay_runner_root }}"
          - -mindepth
          - "1"
          - -maxdepth
          - "1"
          - "!"
          - -name
          - _work
          - "!"
          - -name
          - .runner
          - "!"
          - -name
          - .credentials
          - "!"
          - -name
          - .credentials_rsaparams
          - -print
          - -exec
          - /usr/bin/rm
          - -rf
          - --
          - "{}"
          - +
      register: agent_relay_removed_runner_payload
      changed_when: agent_relay_removed_runner_payload.stdout | length > 0

    - name: Install staged runner payload
      ansible.builtin.copy:
        src: "{{ agent_relay_runner_stage_root }}/"
        dest: "{{ agent_relay_runner_root }}/"
        remote_src: true
        owner: "{{ agent_relay_runner_user }}"
        group: "{{ agent_relay_runner_user }}"
        mode: preserve

    - name: Install runner service launcher
      ansible.builtin.copy:
        src: "{{ agent_relay_runner_root }}/bin/runsvc.sh"
        dest: "{{ agent_relay_runner_root }}/runsvc.sh"
        remote_src: true
        owner: "{{ agent_relay_runner_user }}"
        group: "{{ agent_relay_runner_user }}"
        mode: "0755"

    - name: Validate activated GitHub Runner version
      ansible.builtin.command:
        argv:
          - "{{ agent_relay_runner_root }}/bin/Runner.Listener"
          - --version
      register: agent_relay_activated_runner_version
      changed_when: false
      failed_when: >-
        agent_relay_activated_runner_version.rc != 0
        or (agent_relay_activated_runner_version.stdout | trim) != agent_relay_host_contract.runner_version

  rescue:
    - name: Remove failed runner payload while preserving registration and workspace
      ansible.builtin.command:
        argv:
          - /usr/bin/find
          - "{{ agent_relay_runner_root }}"
          - -mindepth
          - "1"
          - -maxdepth
          - "1"
          - "!"
          - -name
          - _work
          - "!"
          - -name
          - .runner
          - "!"
          - -name
          - .credentials
          - "!"
          - -name
          - .credentials_rsaparams
          - -exec
          - /usr/bin/rm
          - -rf
          - --
          - "{}"
          - +
      changed_when: true

    - name: Restore previous runner payload
      ansible.builtin.unarchive:
        src: "{{ agent_relay_runner_backup_archive }}"
        dest: "{{ agent_relay_runner_root }}"
        remote_src: true
        owner: "{{ agent_relay_runner_user }}"
        group: "{{ agent_relay_runner_user }}"

    - name: Report runner payload activation failure
      ansible.builtin.fail:
        msg: GitHub Runner activation failed and the previous payload was restored.

- name: Reconcile runner root ownership and mode
  ansible.builtin.file:
    path: "{{ agent_relay_runner_root }}"
    state: directory
    owner: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"
    mode: "0700"
    recurse: false

- name: Remove runner staging directory after successful activation
  ansible.builtin.file:
    path: "{{ agent_relay_runner_stage_root }}"
    state: absent

- name: Remove runner payload backup after successful activation
  ansible.builtin.file:
    path: "{{ agent_relay_runner_backup_archive }}"
    state: absent
