---
- name: Stop registered runner listener before mutation
  ansible.builtin.systemd_service:
    name: "{{ agent_relay_service_name }}"
    state: stopped
  when: agent_relay_registration_marker.stat.isreg | default(false)

- name: Wait for active runner jobs to finish
  ansible.builtin.command:
    argv:
      - /usr/bin/pgrep
      - -u
      - "{{ agent_relay_runner_user }}"
      - -x
      - Runner.Worker
  register: agent_relay_worker_state
  changed_when: false
  failed_when: agent_relay_worker_state.rc not in [0, 1]
  until: agent_relay_worker_state.rc == 1
  retries: 150
  delay: 2
  when: agent_relay_registration_marker.stat.isreg | default(false)
