---
- name: Require GitHub credential for runner connection
  ansible.builtin.assert:
    that:
      - agent_relay_github_credential | length > 0
    fail_msg: >-
      Export AGENT_RELAY_GITHUB_CREDENTIAL on the Ansible control machine with organization
      Self-hosted runners: write permission before running playbooks/github-connect.yml.

- name: Inspect prepared runner workspace
  become: true
  ansible.builtin.stat:
    path: "{{ agent_relay_runner_root }}/_work"
    follow: false
  register: agent_relay_connection_workspace

- name: Require prepared runner host
  ansible.builtin.assert:
    that:
      - agent_relay_connection_workspace.stat.isdir | default(false)
    fail_msg: Run playbooks/host.yml before connecting the runner to GitHub.

- name: Inspect runner registration marker
  become: true
  ansible.builtin.stat:
    path: "{{ agent_relay_runner_root }}/.runner"
    follow: false
  register: agent_relay_connection_registration_marker

- name: Create organization runner registration token
  ansible.builtin.uri:
    url: >-
      https://api.github.com/orgs/{{ agent_relay_host_contract.organization }}/actions/runners/registration-token
    method: POST
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ agent_relay_github_credential }}"
      X-GitHub-Api-Version: "{{ agent_relay_host_contract.github_api_version }}"
    return_content: true
    status_code: 201
  register: agent_relay_registration_token
  delegate_to: localhost
  become: false
  no_log: true
  when: not (agent_relay_connection_registration_marker.stat.exists | default(false))

- name: Register organization runner
  become: true
  become_user: "{{ agent_relay_host_contract.runner_user }}"
  ansible.builtin.command:
    argv:
      - ./config.sh
      - --unattended
      - --replace
      - --url
      - "{{ agent_relay_host_contract.organization_url }}"
      - --token
      - "{{ agent_relay_registration_token.json.token }}"
      - --name
      - "{{ agent_relay_host_contract.runner_name }}"
      - --work
      - _work
    chdir: "{{ agent_relay_runner_root }}"
    creates: "{{ agent_relay_runner_root }}/.runner"
  environment:
    HOME: "{{ agent_relay_storage_root }}/home"
  no_log: true
  when: not (agent_relay_connection_registration_marker.stat.exists | default(false))

- name: Inspect runner registration files
  become: true
  ansible.builtin.stat:
    path: "{{ agent_relay_runner_root }}/{{ item }}"
    follow: false
  loop:
    - .runner
    - .credentials
    - .credentials_rsaparams
  register: agent_relay_connection_registration_files

- name: Require complete runner registration
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: "Runner registration file {{ item.item }} is missing or unsafe."
  loop: "{{ agent_relay_connection_registration_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Protect runner registration files
  become: true
  ansible.builtin.file:
    path: "{{ agent_relay_runner_root }}/{{ item }}"
    state: file
    owner: "{{ agent_relay_host_contract.runner_user }}"
    group: "{{ agent_relay_host_contract.runner_user }}"
    mode: "0600"
  loop:
    - .runner
    - .credentials
    - .credentials_rsaparams

- name: Enable and start runner listener
  become: true
  ansible.builtin.systemd_service:
    name: "{{ agent_relay_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Reconcile managed runner label
  ansible.builtin.import_tasks: runner-label.yml
