name: Agent Relay Bootstrap

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: agent-relay-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  codex:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, agent-relay]
    steps:
      - name: Resolve pull request
        id: pr
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "${HEAD_REPOSITORY}" = "${REPOSITORY}"
          git check-ref-format --branch "${HEAD_REF}"
          printf 'head_ref=%s\n' "${HEAD_REF}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Exclude relay artifact
        shell: bash
        run: |
          mkdir -p .agent-relay
          printf '%s\n' '.agent-relay/' >> .git/info/exclude
          rm -f .agent-relay/result.json

      - name: Run Codex through Agent Relay
        id: relay
        continue-on-error: true
        shell: bash
        env:
          AGENT_RELAY_PLAN_PATH: docs/exec-plans/active/2026-07-13-ready-pr-gate.md
          AGENT_RELAY_MODE: implement
          AGENT_RELAY_REQUEST_ID: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node /runner/client.mjs >> "${GITHUB_OUTPUT}" 2> relay-error.log

      - name: Upload Relay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-diagnostics
          path: relay-error.log

      - name: Fail when Relay failed
        if: steps.relay.outcome == 'failure'
        shell: bash
        run: |
          cat relay-error.log
          exit 1

      - name: Commit and push
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ steps.relay.outputs.commit_message }}
          TARGET_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: /runner/finalize.sh
