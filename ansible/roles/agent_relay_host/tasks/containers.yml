---
- name: Create container configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/docker
    - /etc/containerd
    - /etc/systemd/system/docker.socket.d

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/dockerd --validate --config-file=%s
  notify: agent_relay_host restart Docker

- name: Configure containerd
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/containerd --config %s config dump
  notify:
    - agent_relay_host restart containerd
    - agent_relay_host restart Docker

- name: Configure Docker sockets
  ansible.builtin.template:
    src: docker-socket.conf.j2
    dest: /etc/systemd/system/docker.socket.d/agent-relay.conf
    owner: root
    group: root
    mode: "0644"
  notify: agent_relay_host restart Docker socket

- name: Enable and start containerd
  ansible.builtin.systemd_service:
    name: containerd.service
    enabled: true
    state: started

- name: Enable and start Docker socket
  ansible.builtin.systemd_service:
    name: docker.socket
    enabled: true
    daemon_reload: true
    state: started

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Apply container configuration changes
  ansible.builtin.meta: flush_handlers
