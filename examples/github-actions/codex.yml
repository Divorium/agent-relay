name: Codex

on:
  pull_request:
    types:
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to update
        required: true
        type: string
      plan_path:
        description: Active ExecPlan path in the pull request workspace
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-relay-${{ github.repository }}-pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted]
    outputs:
      pr_number: ${{ steps.request.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve execution request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node /srv/github-runner/storage/agent-relay/runner/resolve-request.mjs
      - name: Resolve ready pull request
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
        run: node /srv/github-runner/storage/agent-relay/runner/resolve-pr.mjs
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Validate repository
        run: npm run check

  codex:
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: [self-hosted]
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Re-resolve ready pull request
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
        run: node /srv/github-runner/storage/agent-relay/runner/resolve-pr.mjs
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify credential-free checkout
        shell: bash
        run: |
          set -euo pipefail
          if git config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null; then
            echo 'Checkout credentials must not remain in repository configuration' >&2
            exit 1
          fi
          case "$(git remote get-url origin)" in
            *://*@*) echo 'Repository remote must not contain credentials' >&2; exit 1 ;;
          esac
      - name: Install pull-request runtime dependencies
        run: npm ci
      - name: Build pull-request runtime
        run: npm run build
      - name: Detect missing pull-request ExecPlan
        id: plan_diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          candidates="$(git diff --name-only --diff-filter=AM "${BASE_SHA}...${HEAD_SHA}" -- ':(glob)docs/exec-plans/active/*.md')"
          if [[ -z "$candidates" ]]; then
            printf 'plan_found=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'plan_found=unknown\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve active ExecPlan
        id: plan
        if: github.event_name != 'pull_request' || steps.plan_diff.outputs.plan_found != 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          INPUT_PLAN_PATH: ${{ inputs.plan_path }}
        run: node /srv/github-runner/storage/agent-relay/runner/resolve-plan.mjs
      - name: Report missing active ExecPlan
        if: steps.plan_diff.outputs.plan_found == 'false' || steps.plan.outputs.plan_found == 'false'
        run: echo 'No active ExecPlan was found in this pull request. Codex execution was skipped.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout reviewed execution runtime
        if: steps.plan_diff.outputs.plan_found != 'false' && steps.plan.outputs.plan_found != 'false' && steps.plan.outputs.plan_path != ''
        uses: actions/checkout@v4
        with:
          repository: Divorium/agent-relay
          ref: 8404ac69fe8c79ff6a8998dcdbd4dd9cf4cd2b15
          path: .trusted-codex-runtime
          persist-credentials: false
      - name: Preserve trusted execution runtime
        id: runtime
        if: steps.plan_diff.outputs.plan_found != 'false' && steps.plan.outputs.plan_found != 'false' && steps.plan.outputs.plan_path != ''
        run: |
          set -euo pipefail
          umask 077
          runtime="$(mktemp -d "$RUNNER_TEMP/relay-job-runtime.XXXXXXXX")"
          printf 'root=%s\n' "$runtime" >> "$GITHUB_OUTPUT"
          cp -a .trusted-codex-runtime/. "$runtime/"
          rm -rf -- .trusted-codex-runtime
          cd "$runtime"
          npm ci
          npm run build
      - name: Run Codex directly
        id: codex
        if: steps.plan_diff.outputs.plan_found != 'false' && steps.plan.outputs.plan_found != 'false' && steps.plan.outputs.plan_path != ''
        continue-on-error: true
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          CODEX_TOKEN: ${{ secrets.CODEX_TOKEN }}
          CODEX_VERSION: 0.164.0
          CODEX_PLAN_PATH: ${{ steps.plan.outputs.plan_path }}
          CODEX_WORKSPACE_ROOT: ${{ runner.workspace }}
          CODEX_TRANSCRIPT_PATH: ${{ runner.temp }}/agent-relay-console.log
          RELAY_RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
        run: |
          export PATH=/usr/local/bin:/usr/bin:/bin
          export CODEX_CACHE_ROOT="${RUNNER_TOOL_CACHE:?}/codex-cli"
          /bin/bash "$RELAY_RUNTIME_ROOT/scripts/run-job-codex" node "$RELAY_RUNTIME_ROOT/runner/run-codex.mjs"
      - name: Fail when Codex failed
        if: ${{ steps.codex.outcome == 'failure' }}
        run: exit 1
      - name: Recheck ready pull request before finalization
        if: ${{ steps.codex.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node /srv/github-runner/storage/agent-relay/runner/resolve-pr.mjs
      - name: Commit and push
        id: finalize
        if: ${{ steps.plan_diff.outputs.plan_found != 'false' && steps.plan.outputs.plan_found != 'false' && steps.plan.outputs.plan_path != '' && steps.codex.outcome == 'success' }}
        continue-on-error: true
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: ""
          ENV: ""
          NODE_OPTIONS: ""
          COMMIT_MESSAGE: ${{ steps.codex.outputs.commit_message }}
          TARGET_BRANCH: ${{ steps.pr.outputs.head_ref }}
          GITHUB_PUSH_TOKEN: ${{ github.token }}
          FINALIZE_LOG: ${{ runner.temp }}/agent-relay-finalize.log
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RELAY_RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
        run: |
          export PATH=/usr/local/bin:/usr/bin:/bin
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          /bin/bash "$RELAY_RUNTIME_ROOT/runner/finalize.sh"
      - name: Remove owned execution state
        if: always()
        env:
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          JOB_ROOT: ${{ steps.codex.outputs.codex_job_root }}
        run: |
          set -euo pipefail
          for owned in "$RUNTIME_ROOT" "$JOB_ROOT"; do
            [[ -n "$owned" ]] || continue
            case "$owned" in
              "$RUNNER_TEMP"/relay-job-runtime.*|"$RUNNER_TEMP"/codex-job.*)
                [[ ! -L "$owned" ]] || exit 1
                rm -rf -- "$owned" ;;
              *) echo 'Refusing unexpected cleanup path' >&2; exit 1 ;;
            esac
          done
      - name: Fail when finalization failed
        if: ${{ steps.finalize.outcome == 'failure' }}
        run: exit 1
