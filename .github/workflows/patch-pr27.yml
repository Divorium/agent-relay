name: Apply PR 27 cleanup

on:
  push:
    branches:
      - agent/gate-codex-on-validation
    paths:
      - .github/workflows/patch-pr27.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply final changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test-system/update-script.integration.sh")
          source = path.read_text()
          target = '''run_update() {
            (cd "${SOURCE_ROOT}" && bash "${SOURCE_ROOT}/update.sh")
          }

          run_update > "${ROOT}/update-success.out" 2> "${ROOT}/update-success.err"
          '''
          replacement = '''run_update() {
            (cd "${SOURCE_ROOT}" && bash "${SOURCE_ROOT}/update.sh")
          }

          # The outer repository check already executes the complete test suite. The
          # update harness rewrites host paths and fakes user switching, so a nested
          # node --test run would validate fixture mutations instead of production
          # contracts. Keep the updater orchestration test deterministic.
          : > "${FAST_VALIDATION}"

          run_update > "${ROOT}/update-success.out" 2> "${ROOT}/update-success.err"
          '''
          if source.count(target) != 1:
              raise SystemExit("update harness insertion point was not found exactly once")
          path.write_text(source.replace(target, replacement, 1))
          PY

          git checkout origin/main -- .github/workflows/ci.yml package.json
          rm -f test-system/debug-update-wrapper.sh .github/workflows/patch-pr27.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix update harness validation scope"
          git push origin HEAD:agent/gate-codex-on-validation
