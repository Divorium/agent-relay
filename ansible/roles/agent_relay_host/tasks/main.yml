---
- name: Validate administrator variables
  ansible.builtin.assert:
    that:
      - agent_relay_admin_user is match('^[a-z_][a-z0-9_-]*$')
      - agent_relay_admin_user | length <= 32
      - agent_relay_admin_user not in ['root', agent_relay_runner_user, agent_relay_builder_user]
      - agent_relay_admin_authorized_keys is sequence
      - agent_relay_admin_authorized_keys is not string
      - agent_relay_admin_authorized_keys | length > 0
      - agent_relay_extra_apt_packages is sequence
      - agent_relay_extra_apt_packages is not string
      - agent_relay_extra_apt_packages | intersect(agent_relay_docker_conflicting_packages) | length == 0
    fail_msg: Configure a valid non-reserved administrator, SSH public keys, and non-conflicting package list.

- name: Validate administrator public keys
  ansible.builtin.assert:
    that:
      - item is string
      - item | trim | length > 0
      - "'\n' not in item"
      - "'\r' not in item"
    fail_msg: Each administrator authorized key must be one nonempty physical line.
  loop: "{{ agent_relay_admin_authorized_keys }}"
  no_log: true

- name: Reconcile Agent Relay host while the runner is drained
  block:
    - name: Prepare host mutation
      ansible.builtin.import_tasks: deployment-prepare.yml

    - name: Install repositories and host packages
      ansible.builtin.import_tasks: packages.yml

    - name: Create administrator and service users
      ansible.builtin.import_tasks: users.yml

    - name: Create Agent Relay filesystem roots
      ansible.builtin.import_tasks: filesystem.yml

    - name: Configure container services
      ansible.builtin.import_tasks: containers.yml

    - name: Install Agent Relay toolchains
      ansible.builtin.import_tasks: toolchains.yml

    - name: Checkout and deploy Agent Relay
      ansible.builtin.import_tasks: deploy.yml

  rescue:
    - name: Inspect runtime available after host reconciliation failure
      ansible.builtin.stat:
        path: "{{ agent_relay_source_root }}/dist/src/run-codex.js"
        follow: false
      register: agent_relay_runtime_after_host_failure

    - name: Restore registered runner listener after host reconciliation failure
      ansible.builtin.systemd_service:
        name: "{{ agent_relay_service_name }}"
        enabled: true
        state: started
        daemon_reload: true
      when:
        - agent_relay_registration_marker is defined
        - agent_relay_registration_marker.stat.isreg | default(false)
        - agent_relay_runtime_after_host_failure.stat.isreg | default(false)
        - not (agent_relay_runtime_after_host_failure.stat.islnk | default(false))

    - name: Report host reconciliation failure
      ansible.builtin.fail:
        msg: Agent Relay host reconciliation failed. The previous listener was restarted when its runtime remained usable.
