name: Apply final Docker fix patch

on:
  push:
    branches:
      - agent/fix-docker-conffile-install
    paths:
      - .github/workflows/apply-final-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-docker-conffile-install
          fetch-depth: 0
          persist-credentials: true

      - name: Apply locally verified patch and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-patch/part-* | base64 -d > "${RUNNER_TEMP}/agent-relay-final.patch"
          printf '%s  %s\n' \
            '74903c42a18e78db7ac69200722e37cf41981a6a7e92899208de8f0b96eb265f' \
            "${RUNNER_TEMP}/agent-relay-final.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/agent-relay-final.patch"
          git apply "${RUNNER_TEMP}/agent-relay-final.patch"
          git rm -r .agent-patch .github/workflows/apply-final-patch.yml
          git diff --check
          git config user.name 'agent-relay automation'
          git config user.email 'agent-relay@users.noreply.github.com'
          git add .github/workflows/ci.yml \
            docs/exec-plans/active/2026-07-21-fix-docker-conffile-install.md \
            scripts/docker-host-debian.sh scripts/docker-host.sh \
            test-system/docker-host.repository-safe.sh \
            test/docker-host-contract.test.ts
          git commit -m 'Fix Docker conffile transaction recovery'
          git push origin HEAD:agent/fix-docker-conffile-install
