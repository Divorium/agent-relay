---
- name: Inspect runner registration files
  ansible.builtin.stat:
    path: "{{ agent_relay_runner_root }}/{{ item }}"
    follow: false
  loop:
    - .runner
    - .credentials
    - .credentials_rsaparams
  register: agent_relay_registration_files

- name: Determine runner registration state
  ansible.builtin.set_fact:
    agent_relay_registration_state: >-
      {{
        'absent'
        if (
          agent_relay_registration_files.results
          | selectattr('stat.exists', 'equalto', true)
          | list
          | length
        ) == 0
        else (
          'complete'
          if (
            agent_relay_registration_files.results
            | selectattr('stat.exists', 'equalto', true)
            | selectattr('stat.isreg', 'equalto', true)
            | selectattr('stat.islnk', 'equalto', false)
            | list
            | length
          ) == 3
          else 'partial'
        )
      }}

- name: Reject partial runner registration
  ansible.builtin.assert:
    that:
      - agent_relay_registration_state != 'partial'
    fail_msg: Runner registration is incomplete or has unsafe ownership or permissions.

- name: Protect runner registration files
  ansible.builtin.file:
    path: "{{ agent_relay_runner_root }}/{{ item }}"
    state: file
    owner: "{{ agent_relay_runner_user }}"
    group: "{{ agent_relay_runner_user }}"
    mode: "0600"
  loop:
    - .runner
    - .credentials
    - .credentials_rsaparams
  no_log: true
  when: agent_relay_registration_state == 'complete'

- name: Checkout Agent Relay source
  become: true
  become_user: "{{ agent_relay_admin_user }}"
  ansible.builtin.git:
    repo: "{{ agent_relay_repository_url }}"
    dest: "{{ agent_relay_source_root }}"
    version: "{{ agent_relay_repository_version }}"
    update: true
    force: true
    umask: "0022"
  environment:
    HOME: "/home/{{ agent_relay_admin_user }}"
    GIT_TERMINAL_PROMPT: "0"
  register: agent_relay_checkout_result

- name: Remove group and other write permissions from source
  become: true
  become_user: "{{ agent_relay_admin_user }}"
  ansible.builtin.command:
    argv:
      - find
      - -P
      - "{{ agent_relay_source_root }}"
      - -xdev
      - "("
      - -path
      - "{{ agent_relay_source_root }}/dist"
      - -o
      - -path
      - "{{ agent_relay_source_root }}/dist/*"
      - -o
      - -path
      - "{{ agent_relay_source_root }}/dist.previous"
      - -o
      - -path
      - "{{ agent_relay_source_root }}/dist.previous/*"
      - ")"
      - -prune
      - -o
      - "("
      - -type
      - f
      - -o
      - -type
      - d
      - ")"
      - -perm
      - /022
      - -print
      - -exec
      - chmod
      - go-w
      - --
      - "{}"
      - +
  register: agent_relay_checkout_permissions
  changed_when: agent_relay_checkout_permissions.stdout | length > 0

- name: Inspect runner binary directory
  ansible.builtin.stat:
    path: "{{ agent_relay_runner_root }}/bin"
    follow: false
  register: agent_relay_runner_binary_directory

- name: Require regular runner binary directory
  ansible.builtin.assert:
    that:
      - >-
        not agent_relay_runner_binary_directory.stat.exists
        or (
          agent_relay_runner_binary_directory.stat.isdir | default(false)
          and not (agent_relay_runner_binary_directory.stat.islnk | default(false))
        )
    fail_msg: Runner binary path must be a regular directory.

- name: Inspect runner payload files
  ansible.builtin.stat:
    path: "{{ agent_relay_runner_root }}/{{ item }}"
    follow: false
  loop:
    - bin/Runner.Listener
    - bin/Runner.Worker
    - bin/runsvc.sh
    - config.sh
    - runsvc.sh
  register: agent_relay_runner_payload_files

- name: Determine runner payload completeness
  ansible.builtin.set_fact:
    agent_relay_runner_payload_complete: >-
      {{
        (
          agent_relay_runner_payload_files.results
          | selectattr('stat.exists', 'equalto', true)
          | selectattr('stat.isreg', 'equalto', true)
          | selectattr('stat.islnk', 'equalto', false)
          | selectattr('stat.executable', 'equalto', true)
          | selectattr('stat.pw_name', 'equalto', agent_relay_runner_user)
          | list
          | length
        ) == 5
      }}

- name: Read installed runner version
  ansible.builtin.command:
    argv:
      - "{{ agent_relay_runner_root }}/bin/Runner.Listener"
      - --version
  register: agent_relay_runner_current_version
  changed_when: false
  failed_when: false
  when: agent_relay_runner_payload_complete

- name: Determine whether the runner payload requires reconciliation
  ansible.builtin.set_fact:
    agent_relay_runner_install_required: >-
      {{
        not agent_relay_runner_payload_complete
        or (agent_relay_runner_current_version.stdout | default('') | trim)
          != agent_relay_host_contract.runner_version
      }}

- name: Inspect deployed runtime entrypoint
  ansible.builtin.stat:
    path: "{{ agent_relay_source_root }}/dist/src/run-codex.js"
    follow: false
  register: agent_relay_runtime_entrypoint

- name: Inspect deployed runtime revision marker
  ansible.builtin.stat:
    path: "{{ agent_relay_source_root }}/dist/{{ agent_relay_runtime_revision_marker }}"
    follow: false
  register: agent_relay_runtime_revision_marker_state

- name: Read deployed runtime revision marker
  ansible.builtin.slurp:
    src: "{{ agent_relay_source_root }}/dist/{{ agent_relay_runtime_revision_marker }}"
  register: agent_relay_runtime_revision_content
  when:
    - agent_relay_runtime_revision_marker_state.stat.isreg | default(false)
    - not (agent_relay_runtime_revision_marker_state.stat.islnk | default(false))

- name: Determine whether the runtime requires activation
  ansible.builtin.set_fact:
    agent_relay_runtime_deployment_required: >-
      {{
        not (agent_relay_runtime_entrypoint.stat.isreg | default(false))
        or (agent_relay_runtime_entrypoint.stat.islnk | default(false))
        or (agent_relay_runtime_entrypoint.stat.pw_name | default('')) != 'root'
        or (agent_relay_runtime_entrypoint.stat.gr_name | default('')) != 'root'
        or (agent_relay_runtime_entrypoint.stat.mode | default('')) != '0644'
        or not (agent_relay_runtime_revision_marker_state.stat.isreg | default(false))
        or (agent_relay_runtime_revision_marker_state.stat.islnk | default(false))
        or (agent_relay_runtime_revision_marker_state.stat.pw_name | default('')) != 'root'
        or (agent_relay_runtime_revision_marker_state.stat.gr_name | default('')) != 'root'
        or (agent_relay_runtime_revision_marker_state.stat.mode | default('')) != '0644'
        or (
          agent_relay_runtime_revision_content.content
          | default('')
          | b64decode
          | trim
        ) != agent_relay_checkout_result.after
      }}

- name: Install runner systemd unit
  ansible.builtin.template:
    src: actions-runner.service.j2
    dest: "{{ agent_relay_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: agent_relay_service_unit_result

- name: Reconcile runner payload and runtime
  when:
    - agent_relay_runner_install_required
      or agent_relay_runtime_deployment_required
      or agent_relay_service_unit_result.changed
  block:
    - name: Prepare runner mutation
      ansible.builtin.import_tasks: deployment-prepare.yml

    - name: Install GitHub Runner payload
      ansible.builtin.import_tasks: runner-installation.yml
      when: agent_relay_runner_install_required

    - name: Build and activate Agent Relay runtime
      ansible.builtin.import_tasks: runtime-deployment.yml
      when: agent_relay_runtime_deployment_required

  rescue:
    - name: Inspect runtime available after failed mutation
      ansible.builtin.stat:
        path: "{{ agent_relay_source_root }}/dist/src/run-codex.js"
        follow: false
      register: agent_relay_runtime_after_failed_mutation

    - name: Restore registered runner listener after failed mutation
      ansible.builtin.systemd_service:
        name: "{{ agent_relay_service_name }}"
        enabled: true
        state: started
        daemon_reload: true
      when:
        - agent_relay_registration_state == 'complete'
        - agent_relay_runtime_after_failed_mutation.stat.isreg | default(false)
        - not (agent_relay_runtime_after_failed_mutation.stat.islnk | default(false))

    - name: Report runner mutation failure
      ansible.builtin.fail:
        msg: Agent Relay runner or runtime reconciliation failed.

- name: Reconcile runner listener state
  ansible.builtin.import_tasks: listener-state.yml
