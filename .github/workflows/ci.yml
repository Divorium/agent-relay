name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run checks
        id: checks
        continue-on-error: true
        run: npm run check > check.log 2>&1
      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log
      - name: Fail when checks failed
        if: steps.checks.outcome == 'failure'
        run: |
          cat check.log
          exit 1

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          RUNNER_TOKEN: placeholder
          RUNNER_REPOSITORY_URL: https://github.com/owner/repository
          RUNNER_NAME: agent-relay-ci
          RUNNER_LABELS: agent-relay
          AGENT_RELAY_TOKEN: placeholder-relay-token
          HOST_CODEX_AUTH_FILE: /tmp/codex-credential
          HOST_UID: "1000"
          HOST_GID: "1000"
        run: |
          touch /tmp/codex-credential
          docker compose config

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Agent Relay image
        run: docker build --tag agent-relay:ci .
      - name: Verify required toolchain
        id: toolchain
        continue-on-error: true
        run: docker run --rm --entrypoint /bin/bash agent-relay:ci /app/scripts/toolchain-smoke.sh > toolchain.log 2>&1
      - name: Upload toolchain log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-log
          path: toolchain.log
      - name: Fail when toolchain verification failed
        if: steps.toolchain.outcome == 'failure'
        run: |
          cat toolchain.log
          exit 1
      - name: Verify isolated Codex boundary
        id: isolation
        continue-on-error: true
        run: |
          docker run --rm --user root --entrypoint /bin/bash agent-relay:ci -lc '
            set -euxo pipefail
            mkdir -p /tmp/codex-root/current /tmp/codex-root/sibling
            chown -R agent:agent /tmp/codex-root
            runuser -u agent -- git -C /tmp/codex-root/current init
            printf sibling-private > /tmp/codex-root/sibling/private
            chown agent:agent /tmp/codex-root/sibling/private
            printf stale-home-state > /home/agent/.codex/sentinel
            chown agent:agent /home/agent/.codex/sentinel
            runuser -u agent -- /usr/local/bin/codex \
              -c features.memories=false \
              -c "default_permissions=\"relay\"" \
              -c "permissions.relay.extends=\":workspace\"" \
              -c "permissions.relay.filesystem={\"/home/agent/.codex\"=\"deny\",\"/app\"=\"deny\",\"/home/relay\"=\"deny\",\"/tmp/codex-root\"=\"deny\",\"/tmp/codex-root/current\"=\"write\",\"/tmp/codex-root/current/.git\"=\"read\"}" \
              -c permissions.relay.network.enabled=true \
              sandbox -P relay -C /tmp/codex-root/current \
              /bin/bash -lc "git status --short >/dev/null && test ! -r /home/agent/.codex/sentinel && test ! -r /tmp/codex-root/sibling/private && test ! -r /app/dist/src/server.js && touch workspace-write-ok && ! touch .git/sandbox-write-denied"
            test -f /tmp/codex-root/current/workspace-write-ok
            test ! -e /tmp/codex-root/current/.git/sandbox-write-denied
            runuser -u agent -- test ! -r /app/dist/src/server.js
            su -s /bin/bash relay -c "cd /tmp/codex-root/current && sudo -H -u agent -- /usr/local/bin/codex-run --version"
            test ! -e /home/agent/.codex/sentinel
          ' > isolation.log 2>&1
      - name: Upload isolation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-log
          path: isolation.log
      - name: Fail when isolation verification failed
        if: steps.isolation.outcome == 'failure'
        run: |
          cat isolation.log
          exit 1
      - name: Verify excluded tools
        run: |
          if docker run --rm --entrypoint /bin/bash agent-relay:ci -lc 'command -v ssh'; then
            echo 'OpenSSH must not be installed' >&2
            exit 1
          fi
          if docker run --rm --entrypoint /bin/bash agent-relay:ci -lc 'command -v dotnet'; then
            echo '.NET SDK must not be installed' >&2
            exit 1
          fi
      - name: Build runner image
        run: docker build --file Dockerfile.runner --tag agent-relay-runner:ci .
      - name: Verify runner image
        run: |
          docker run --rm --entrypoint /bin/bash agent-relay-runner:ci -lc '
            node --version &&
            git --version &&
            test -x /entrypoint.sh &&
            test -x /runner/client.mjs &&
            test -x /runner/resolve-pr.mjs &&
            test -x /runner/finalize.sh
          '
