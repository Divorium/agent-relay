---
- name: Require GitHub credential for runner installation lifecycle
  ansible.builtin.assert:
    that:
      - agent_relay_github_credential | length > 0
    fail_msg: >-
      Export AGENT_RELAY_GITHUB_CREDENTIAL on the Ansible control machine with organization
      Self-hosted runners: write permission before running the installation playbook.
  when: agent_relay_manage_runner_lifecycle | bool

- name: Install repositories and host packages
  ansible.builtin.import_tasks: packages.yml

- name: Create administrator and service users
  ansible.builtin.import_tasks: users.yml

- name: Create Agent Relay filesystem roots
  ansible.builtin.import_tasks: filesystem.yml

- name: Configure container services
  ansible.builtin.import_tasks: containers.yml

- name: Install Agent Relay toolchains
  ansible.builtin.import_tasks: toolchains.yml

- name: Checkout and deploy Agent Relay
  ansible.builtin.import_tasks: deploy.yml

- name: Reconcile Agent Relay runner label
  ansible.builtin.import_tasks: runner-label.yml
  when: agent_relay_manage_runner_lifecycle | bool
