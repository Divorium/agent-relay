---
- name: Replace runner workspace symlink with a real directory
  hosts: agent_relay
  gather_facts: false
  become: true

  vars:
    runner_workspace_contract: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../config/runner-host.json') | from_json }}"
    runner_workspace_storage_root: "{{ runner_workspace_contract.base_root }}/storage"
    runner_workspace_runner_root: "{{ runner_workspace_storage_root }}/runner"
    runner_workspace_path: "{{ runner_workspace_runner_root }}/_work"
    runner_workspace_obsolete_path: "{{ runner_workspace_storage_root }}/work"
    runner_workspace_user: "{{ runner_workspace_contract.runner_user }}"
    runner_workspace_service_name: "actions.runner.{{ runner_workspace_contract.organization }}.{{ runner_workspace_contract.runner_name }}.service"

  tasks:
    - name: Stop runner listener
      ansible.builtin.systemd_service:
        name: "{{ runner_workspace_service_name }}"
        state: stopped

    - name: Remove runner workspace symlink
      ansible.builtin.file:
        path: "{{ runner_workspace_path }}"
        state: absent

    - name: Remove obsolete runner workspace
      ansible.builtin.file:
        path: "{{ runner_workspace_obsolete_path }}"
        state: absent

    - name: Create runner workspace directory
      ansible.builtin.file:
        path: "{{ runner_workspace_path }}"
        state: directory
        owner: "{{ runner_workspace_user }}"
        group: "{{ runner_workspace_user }}"
        mode: "0700"

    - name: Start runner listener
      ansible.builtin.systemd_service:
        name: "{{ runner_workspace_service_name }}"
        state: started
