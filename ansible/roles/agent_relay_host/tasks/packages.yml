---
- name: Install repository bootstrap packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3
      - python3-apt
      - sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Read NodeSource signing key fingerprint
  ansible.builtin.command:
    argv: ["/usr/bin/gpg", "--show-keys", "--with-colons", "/etc/apt/keyrings/nodesource.asc"]
  register: agent_relay_nodesource_signing_key
  changed_when: false

- name: Require trusted NodeSource signing key
  ansible.builtin.assert:
    that:
      - "'fpr:::::::::6F71F525282841EEDAF851B42F59B5F99B1BE0B4:' in agent_relay_nodesource_signing_key.stdout"
    fail_msg: The downloaded NodeSource signing key has an unexpected fingerprint.

- name: Configure NodeSource repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ agent_relay_node_major }}.x
      Suites: nodistro
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/nodesource.asc

- name: Install Adoptium signing key
  ansible.builtin.get_url:
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public
    dest: /etc/apt/keyrings/adoptium.asc
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Read Adoptium signing key fingerprint
  ansible.builtin.command:
    argv: ["/usr/bin/gpg", "--show-keys", "--with-colons", "/etc/apt/keyrings/adoptium.asc"]
  register: agent_relay_adoptium_signing_key
  changed_when: false

- name: Require trusted Adoptium signing key
  ansible.builtin.assert:
    that:
      - "'fpr:::::::::3B04D753C9050D9A5D343F39843C48A565F8F04B:' in agent_relay_adoptium_signing_key.stdout"
    fail_msg: The downloaded Adoptium signing key has an unexpected fingerprint.

- name: Configure Adoptium repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/adoptium.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://packages.adoptium.net/artifactory/deb
      Suites: trixie
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/adoptium.asc

- name: Install Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Read Docker signing key fingerprint
  ansible.builtin.command:
    argv: ["/usr/bin/gpg", "--show-keys", "--with-colons", "/etc/apt/keyrings/docker.asc"]
  register: agent_relay_docker_signing_key
  changed_when: false

- name: Require trusted Docker signing key
  ansible.builtin.assert:
    that:
      - "'fpr:::::::::9DC858229FC7DD38854AE2D88D81803C0EBFCD88:' in agent_relay_docker_signing_key.stdout"
    fail_msg: The downloaded Docker signing key has an unexpected fingerprint.

- name: Configure Docker repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: trixie
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install host packages and configured extensions
  ansible.builtin.apt:
    name: "{{ (agent_relay_required_apt_packages + agent_relay_extra_apt_packages + ['temurin-' ~ agent_relay_java_major ~ '-jdk']) | unique }}"
    state: present
    update_cache: true

- name: Install configured Node.js major
  ansible.builtin.apt:
    name: "nodejs={{ agent_relay_node_major }}.*"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Remove packages conflicting with Docker Engine
  ansible.builtin.apt:
    name: "{{ agent_relay_docker_conflicting_packages }}"
    state: absent

- name: Install Docker packages without premature service start
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Create needrestart policy directory
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Protect GitHub runner units from automatic needrestart restarts
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/actions_runner_services.conf
    owner: root
    group: root
    mode: "0644"
    content: "$nrconf{override_rc}{qr(^actions\\.runner\\..+\\.service$)} = 0;\n"
